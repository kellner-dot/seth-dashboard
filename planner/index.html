<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Day Planner</title>
<meta name="theme-color" content="#04060c">
<style>
  :root{
    --bg:#04060c;
    --txt:#f2f6fc; --dim:#a9b4c8; --faint:#5f6b85;
    --acc1:#6ee7ff; --acc2:#a78bfa; --acc3:#f472b6;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --focus:#6ee7ff;
    --card:rgba(16,22,38,.78);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg); font-size:26px; overflow-x:hidden;
  }
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1400px 700px at 12% -5%, rgba(110,231,255,.08), transparent 60%),
      radial-gradient(1200px 800px at 92% 8%, rgba(167,139,250,.09), transparent 60%),
      radial-gradient(1000px 900px at 50% 110%, rgba(244,114,182,.05), transparent 60%);}
  .orb{position:fixed; border-radius:50%; filter:blur(120px); opacity:.12; pointer-events:none; z-index:0;
       animation:drift 32s ease-in-out infinite alternate;}
  .orb.o1{width:440px;height:440px;left:-120px;top:8%;background:#0ea5e9;}
  .orb.o2{width:400px;height:400px;right:-110px;top:40%;background:#7c3aed;animation-delay:-11s;}
  .orb.o3{width:340px;height:340px;left:34%;bottom:-120px;background:#db2777;animation-delay:-22s;opacity:.08;}
  @keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(60px,80px) scale(1.12);}}

  .wrap{position:relative; z-index:1; padding-bottom:140px;}
  .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:16px 64px 14px;
    background:linear-gradient(180deg, rgba(4,6,12,.97) 0%, rgba(4,6,12,.85) 65%, transparent 100%);}
  .brand{display:flex; align-items:center; gap:20px;}
  .logo{width:64px; height:64px; border-radius:18px; display:grid; place-items:center; flex:none;
        background:conic-gradient(from 200deg,#0ea5e9,#8b5cf6,#ec4899,#0ea5e9);
        box-shadow:0 0 28px rgba(139,92,246,.45), inset 0 0 0 2px rgba(255,255,255,.25);}
  .logo svg{width:36px;height:36px;}
  .brand h1{margin:0; font-size:38px; letter-spacing:8px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 45%,var(--acc2) 75%,var(--acc3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .sub{font-size:20px; color:var(--faint); letter-spacing:3px; margin-top:2px;}
  .top-right{display:flex; align-items:center; gap:26px;}
  #clock{font-size:42px; font-weight:700; letter-spacing:2px;}
  #dateline{font-size:26px; color:var(--dim); letter-spacing:1px;}

  section{margin:34px 64px 0;}
  section h2{font-size:30px; letter-spacing:4px; color:var(--dim); margin:0 0 18px; font-weight:800; text-transform:uppercase;}
  section h2 .tag{font-size:20px; color:var(--faint); letter-spacing:1px; font-weight:600; text-transform:none; margin-left:12px;}

  /* today agenda */
  .agenda{display:flex; flex-direction:column; gap:18px;}
  .ev{display:grid; grid-template-columns:300px 1fr; gap:30px; align-items:center;
      background:var(--card); border:2px solid rgba(110,231,255,.14); border-radius:22px; padding:30px 36px;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .ev.focused{border-color:var(--focus); transform:scale(1.015); box-shadow:0 0 34px rgba(110,231,255,.35);}
  .ev .when{font-size:44px; font-weight:800; color:var(--acc1); line-height:1.1;}
  .ev .when .rng{font-size:28px; color:var(--dim); font-weight:600; display:block; margin-top:6px;}
  .ev .what{font-size:40px; font-weight:700;}
  .ev .src{font-size:22px; color:var(--faint); margin-top:6px;}
  .ev .nowpill{display:inline-block; font-size:22px; font-weight:800; letter-spacing:2px; color:#04231a;
               background:var(--ok); border-radius:99px; padding:6px 18px; margin-bottom:10px;}
  .ev.past{opacity:.55;}
  .ev.empty{background:transparent; border-style:dashed; justify-content:center; display:flex;}

  /* two-column row: tomorrow + countdown */
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  .card{background:var(--card); border:2px solid rgba(167,139,250,.18); border-radius:22px; padding:34px 38px;
        transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .card.focused{border-color:var(--focus); transform:scale(1.02); box-shadow:0 0 34px rgba(110,231,255,.35);}
  .tm-ev{padding:16px 0; border-bottom:1px solid rgba(255,255,255,.07); font-size:30px;}
  .tm-ev:last-child{border-bottom:none;}
  .tm-ev .t{color:var(--acc2); font-weight:800; font-size:32px;}
  .count-big{font-size:110px; font-weight:800; line-height:1;
    background:linear-gradient(92deg,#fff,#6ee7ff); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .count-cap{font-size:30px; color:var(--dim); margin-top:10px;}
  .count-sub{font-size:24px; color:var(--faint); margin-top:14px;}

  /* week strip */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:18px;}
  .day{background:var(--card); border:2px solid rgba(110,231,255,.12); border-radius:20px; padding:22px 18px; text-align:center;
       transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; min-height:190px;}
  .day.focused{border-color:var(--focus); transform:scale(1.05); box-shadow:0 0 28px rgba(110,231,255,.35);}
  .day.today{border-color:rgba(52,211,153,.5);}
  .day .dw{font-size:24px; color:var(--dim); letter-spacing:2px; font-weight:700;}
  .day .dn{font-size:52px; font-weight:800; margin:6px 0;}
  .day .dc{font-size:22px; color:var(--dim); line-height:1.35;}
  .day .dots{margin-top:8px; font-size:20px; letter-spacing:3px; color:var(--acc3);}

  .skel{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 75%);
        background-size:200% 100%; animation:shimmer 1.4s linear infinite; border-radius:12px; min-height:60px;}
  @keyframes shimmer{to{background-position:-200% 0;}}

  #overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
           background:rgba(2,4,10,.82); backdrop-filter:blur(6px);}
  #overlay.show{display:flex;}
  .ov-card{width:min(1000px,86vw); max-height:80vh; overflow:auto; background:#0b1220; border:2px solid var(--focus);
           border-radius:26px; padding:44px 54px;}
  .ov-card h3{margin:0 0 12px; font-size:44px;}
  .ov-card .big{font-size:36px; color:var(--acc1); font-weight:800; margin-bottom:14px;}
  .ov-card p{font-size:28px; color:var(--dim); line-height:1.5;}
  .ov-card .hint{font-size:22px; color:var(--faint); margin-top:24px;}

  .foot{margin:40px 64px 0; font-size:20px; color:var(--faint); display:flex; justify-content:space-between;}
  .kbd-hint{position:fixed; bottom:18px; left:64px; font-size:20px; color:var(--faint); z-index:5;}
  @media (max-width:1400px){ .duo{grid-template-columns:1fr;} .week{grid-template-columns:repeat(4,1fr);} .ev{grid-template-columns:220px 1fr;} }
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
        <div><h1>DAY PLANNER</h1><div class="sub">YOUR DAY, AT A GLANCE</div></div>
      </div>
      <div class="top-right">
        <div id="dateline">—</div>
        <div id="clock">--:--</div>
      </div>
    </div>

    <section id="sec-today">
      <h2>Today <span class="tag" id="today-tag"></span></h2>
      <div class="agenda" id="today-list"></div>
    </section>

    <section>
      <div class="duo">
        <div>
          <h2 style="font-size:30px;letter-spacing:4px;color:var(--dim);margin:0 0 18px;font-weight:800;text-transform:uppercase">Tomorrow</h2>
          <div class="card foc" id="tm-card" data-nav="tm" tabindex="-1"></div>
        </div>
        <div>
          <h2 style="font-size:30px;letter-spacing:4px;color:var(--dim);margin:0 0 18px;font-weight:800;text-transform:uppercase">Coming up</h2>
          <div class="card foc" id="count-card" data-nav="count" tabindex="-1"></div>
        </div>
      </div>
    </section>

    <section id="sec-week">
      <h2>This week</h2>
      <div class="week" id="week-strip"></div>
    </section>

    <div class="foot">
      <span id="updated-note">starting…</span>
      <span>↻ refreshes every 15 min</span>
    </div>
  </div>

  <div class="kbd-hint">▲▼◀▶ move · <b>OK</b> details · <b>Back</b> close</div>

  <div id="overlay"><div class="ov-card" id="ov-card"></div></div>
<script>
'use strict';
const ET = 'America/New_York';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const HEARING_ISO = '2026-11-12T08:15:00-05:00';

function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('en-US',{timeZone:ET,hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('en-US',{timeZone:ET,weekday:'long',month:'long',day:'numeric'}); }catch(e){ return ''; } }
function etYMD(d){ return d.toLocaleDateString('en-CA',{timeZone:ET}); } // YYYY-MM-DD
function etNow(){ return new Date(new Date().toLocaleString('en-US',{timeZone:ET})); }

/* ---------- fallback events (used only if calendar.json is missing) ---------- */
function fallbackEvents(){
  const ev=[
    {title:'Disability hearing', start_iso:'2026-11-12T08:15:00-05:00', end_iso:'2026-11-12T09:15:00-05:00', all_day:false, source:'planner'},
    {title:'Warner prep call', start_iso:'2026-10-22T13:00:00-04:00', end_iso:'2026-10-22T14:00:00-04:00', all_day:false, source:'planner'},
    {title:'Albany Nightmare Market', start_iso:'2026-10-17T10:00:00-04:00', end_iso:'2026-10-17T18:00:00-04:00', all_day:true, source:'planner'},
    {title:'Upstate at Billsville', start_iso:'2026-11-20T19:00:00-05:00', end_iso:'2026-11-20T22:00:00-05:00', all_day:true, source:'planner'},
  ];
  // Xfinity bill: $51 on the 17th, next 6 occurrences
  const now=etNow();
  for(let i=0;i<6;i++){
    const y=now.getFullYear(), m=now.getMonth()+i;
    const d=new Date(y,m,17);
    const off=(d.getTimezoneOffset()!==240&&m>=3&&m<11)?'-04:00':'-05:00';
    ev.push({title:'Xfinity bill — $51', start_iso:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-17T09:00:00${off}`, end_iso:null, all_day:true, source:'planner'});
  }
  return {events:ev, generated_iso:null, fallback:true};
}

let DATA=null, ROWS=[], focus={r:0,c:0};

async function fetchJSON(rel){
  try{ const r=await fetch(rel,{cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return null; }
}

function tickClock(){
  const n=new Date();
  $('#clock').textContent=n.toLocaleTimeString('en-US',{timeZone:ET,hour:'numeric',minute:'2-digit'});
  $('#dateline').textContent=n.toLocaleDateString('en-US',{timeZone:ET,weekday:'long',month:'long',day:'numeric'});
}
setInterval(tickClock,15000); tickClock();

function eventsByDay(){
  const map={};
  (DATA.events||[]).forEach(e=>{
    const y=etYMD(new Date(e.start_iso));
    (map[y]=map[y]||[]).push(e);
  });
  Object.values(map).forEach(list=>list.sort((a,b)=>new Date(a.start_iso)-new Date(b.start_iso)));
  return map;
}

function evWhen(e){
  if(e.all_day) return {big:'All day', rng:''};
  const s=fmtTime(e.start_iso);
  const rng=e.end_iso?fmtTime(e.start_iso)+' – '+fmtTime(e.end_iso):'';
  return {big:s, rng};
}
function isHappening(e){
  const now=Date.now(), s=new Date(e.start_iso).getTime();
  const end=e.end_iso?new Date(e.end_iso).getTime():s+3600e3;
  return now>=s&&now<=end;
}
function isPast(e){
  const now=Date.now();
  const end=e.end_iso?new Date(e.end_iso).getTime():new Date(e.start_iso).getTime()+3600e3;
  return now>end;
}

/* ---------- today ---------- */
function renderToday(){
  const list=$('#today-list'), tag=$('#today-tag');
  const byDay=eventsByDay(), t=etYMD(new Date());
  tag.textContent=new Date().toLocaleDateString('en-US',{timeZone:ET,weekday:'long',month:'long',day:'numeric'});
  const evs=byDay[t]||[];
  if(!evs.length){
    list.innerHTML=`<div class="ev empty foc" data-nav="ev" data-idx="-1" tabindex="-1"><div class="what" style="color:var(--faint)">Nothing scheduled — a quiet day.</div></div>`;
    return;
  }
  list.innerHTML=evs.map((e,i)=>{
    const w=evWhen(e), now=isHappening(e), past=isPast(e)&&!now;
    return `<div class="ev foc${past?' past':''}" data-nav="ev" data-idx="${i}" data-day="today" tabindex="-1">
      <div class="when">${now?'<span class="nowpill">NOW</span>':''}${esc(w.big)}${w.rng?`<span class="rng">${esc(w.rng)}</span>`:''}</div>
      <div><div class="what">${esc(e.title)}</div>${e.source&&e.source!=='planner'?`<div class="src">${esc(e.source)}</div>`:''}</div>
    </div>`;
  }).join('');
}

/* ---------- tomorrow ---------- */
function renderTomorrow(){
  const card=$('#tm-card'), byDay=eventsByDay();
  const tm=new Date(); tm.setDate(tm.getDate()+1);
  const y=etYMD(tm), evs=byDay[y]||[];
  const label=tm.toLocaleDateString('en-US',{timeZone:ET,weekday:'long',month:'long',day:'numeric'});
  card.innerHTML=`<div class="src" style="font-size:22px;color:var(--faint);margin-bottom:10px">${esc(label)}</div>`+
    (evs.length?evs.map(e=>{const w=evWhen(e);return `<div class="tm-ev"><span class="t">${esc(w.big)}</span> · ${esc(e.title)}</div>`;}).join('')
               :`<div class="tm-ev" style="color:var(--faint)">Nothing scheduled yet.</div>`);
}

/* ---------- countdown ---------- */
function renderCountdown(){
  const card=$('#count-card');
  const now=etNow();
  const h=new Date(HEARING_ISO);
  const startOfToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startOfH=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  const days=Math.round((startOfH-startOfToday)/86400000);
  const word=days>1?`${days} days to go`:days===1?'1 day to go':days===0?'Today':`${Math.abs(days)} days ago`;
  card.innerHTML=`<div class="src" style="font-size:22px;color:var(--faint);margin-bottom:10px">Disability hearing</div>
    <div class="count-big">${esc(word)}</div>
    <div class="count-cap">${fmtDate(HEARING_ISO)} · ${fmtTime(HEARING_ISO)}</div>
    <div class="count-sub">You've got this. One step at a time.</div>`;
}

/* ---------- week strip ---------- */
function renderWeek(){
  const strip=$('#week-strip'), byDay=eventsByDay(), todayY=etYMD(new Date());
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const y=etYMD(d), evs=byDay[y]||[];
    const dw=d.toLocaleDateString('en-US',{timeZone:ET,weekday:'short'});
    const dn=d.toLocaleDateString('en-US',{timeZone:ET,day:'numeric'});
    const titles=evs.slice(0,3).map(e=>esc(e.title)).join('<br>');
    const more=evs.length>3?`<br>+${evs.length-3} more`:'';
    html+=`<div class="day foc${y===todayY?' today':''}" data-nav="day" data-idx="${i}" tabindex="-1">
      <div class="dw">${esc(dw)}${y===todayY?' · TODAY':''}</div><div class="dn">${esc(dn)}</div>
      <div class="dc">${titles||'<span style="color:var(--faint)">—</span>'}${more}</div>
      <div class="dots">${evs.length?'●'.repeat(Math.min(evs.length,5)):''}</div>
    </div>`;
  }
  strip.innerHTML=html;
}

/* ---------- nav ---------- */
function buildNav(){
  ROWS=[];
  const evs=[...document.querySelectorAll('#today-list .foc')]; if(evs.length) ROWS.push(evs);
  const duo=[...document.querySelectorAll('.duo .foc')]; if(duo.length) ROWS.push(duo);
  const days=[...document.querySelectorAll('#week-strip .foc')]; if(days.length) ROWS.push(days);
  focus.r=clamp(focus.r,0,ROWS.length-1);
  focus.c=clamp(focus.c,0,ROWS[focus.r].length-1);
}
function applyFocus(){
  document.querySelectorAll('.foc.focused').forEach(el=>el.classList.remove('focused'));
  const row=ROWS[focus.r]; if(!row) return;
  const el=row[focus.c]; if(!el) return;
  el.classList.add('focused');
  el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function move(dr,dc){
  if(overlayOpen()) return;
  if(!ROWS.length) return;
  let r=clamp(focus.r+dr,0,ROWS.length-1);
  let c=focus.c;
  if(dc!==0) c=clamp(c+dc,0,ROWS[r].length-1);
  else c=clamp(Math.round(c*(ROWS[r].length-1)/Math.max(1,ROWS[focus.r].length-1)),0,ROWS[r].length-1);
  focus={r,c}; applyFocus();
}

/* ---------- overlay ---------- */
function overlayOpen(){ return $('#overlay').classList.contains('show'); }
function openOverlay(html){ $('#ov-card').innerHTML=html+`<div class="hint">Press <b>Back</b> to close</div>`; $('#overlay').classList.add('show'); }
function closeOverlay(){ $('#overlay').classList.remove('show'); applyFocus(); }
function findEvent(el){
  const byDay=eventsByDay();
  if(el.dataset.day==='today'){ return (byDay[etYMD(new Date())]||[])[+el.dataset.idx]; }
  if(el.dataset.nav==='day'){
    const d=new Date(); d.setDate(d.getDate()+(+el.dataset.idx));
    return (byDay[etYMD(d)]||[]);
  }
  return null;
}
function activate(){
  if(overlayOpen()){ closeOverlay(); return; }
  const row=ROWS[focus.r]; if(!row) return;
  const el=row[focus.c]; if(!el) return;
  const nav=el.dataset.nav;
  if(nav==='ev'&&el.dataset.idx!=='-1'){
    const e=findEvent(el); if(!e) return;
    const w=evWhen(e);
    openOverlay(`<h3>${esc(e.title)}</h3><div class="big">${esc(w.big)}${w.rng?' · '+esc(w.rng):''}</div>
      <p>${fmtDate(e.start_iso)}${e.source?`<br><span style="color:var(--faint)">from ${esc(e.source)}</span>`:''}</p>`);
  }else if(nav==='day'){
    const evs=findEvent(el)||[];
    const d=new Date(); d.setDate(d.getDate()+(+el.dataset.idx));
    openOverlay(`<h3>${d.toLocaleDateString('en-US',{timeZone:ET,weekday:'long',month:'long',day:'numeric'})}</h3>
      ${evs.length?evs.map(e=>{const w=evWhen(e);return `<div class="big">${esc(w.big)}</div><p>${esc(e.title)}</p>`;}).join(''):'<p>Nothing scheduled.</p>'}`);
  }else if(nav==='tm'){
    const tm=new Date(); tm.setDate(tm.getDate()+1);
    const byDay=eventsByDay(), evs=byDay[etYMD(tm)]||[];
    openOverlay(`<h3>Tomorrow</h3>${evs.length?evs.map(e=>{const w=evWhen(e);return `<div class="big">${esc(w.big)}</div><p>${esc(e.title)}</p>`;}).join(''):'<p>Nothing scheduled yet.</p>'}`);
  }else if(nav==='count'){
    openOverlay(`<h3>Disability hearing</h3><div class="big">${fmtDate(HEARING_ISO)} · ${fmtTime(HEARING_ISO)}</div><p>Video hearing. Your prep materials are ready — you've done the work.</p>`);
  }
}

/* ---------- keys ---------- */
document.addEventListener('keydown', e=>{
  const k=e.key;
  if(overlayOpen()){
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){ closeOverlay(); e.preventDefault(); }
    return;
  }
  switch(k){
    case 'ArrowLeft': move(0,-1); e.preventDefault(); break;
    case 'ArrowRight': move(0,1); e.preventDefault(); break;
    case 'ArrowUp': move(-1,0); e.preventDefault(); break;
    case 'ArrowDown': move(1,0); e.preventDefault(); break;
    case 'Enter': activate(); e.preventDefault(); break;
    case 'Escape': case 'Backspace': e.preventDefault(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.keyCode===10009||e.keyCode===461){
    if(overlayOpen()){ closeOverlay(); e.preventDefault(); }
  }
});

/* ---------- main ---------- */
async function refresh(){
  const first=!DATA;
  const j=await fetchJSON('calendar.json');
  DATA=j||fallbackEvents();
  renderToday(); renderTomorrow(); renderCountdown(); renderWeek();
  buildNav();
  if(first){ focus={r:0,c:0}; applyFocus(); } else applyFocus();
  $('#updated-note').textContent=DATA.generated_iso
    ? 'calendar updated '+new Date(DATA.generated_iso).toLocaleTimeString('en-US',{timeZone:ET,hour:'numeric',minute:'2-digit'})
    : (DATA.fallback?'showing saved events (calendar.json not found yet)':'starting…');
}
refresh();
setInterval(refresh,15*60*1000);
</script>
</body>
</html>
