<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mission Control</title>
<meta name="theme-color" content="#0a0e14">
<style>
  :root{
    --bg:#0a0e14; --panel:#11161f; --panel2:#161c28;
    --txt:#e6edf3; --dim:#8b949e; --acc:#58a6ff;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--txt);
       font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
  header{padding:18px 4px 10px; display:flex; align-items:baseline; justify-content:space-between;}
  header h1{margin:0; font-size:22px; letter-spacing:.5px;}
  header h1 .dot{color:var(--acc);}
  #updated{font-size:11px; color:var(--dim);}
  .grid{display:grid; gap:12px; grid-template-columns:1fr;}
  @media(min-width:700px){ .grid{grid-template-columns:1fr 1fr;} }
  .card{background:var(--panel); border:1px solid #1e2634; border-radius:var(--radius);
        padding:14px 16px; position:relative; overflow:hidden;}
  .card h2{margin:0 0 2px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .card .sub{font-size:12px; color:var(--dim); margin-bottom:10px;}
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 10px;
        border-radius:99px; text-transform:uppercase; letter-spacing:.6px;}
  .pill.on{background:rgba(63,185,80,.15); color:var(--ok); border:1px solid rgba(63,185,80,.4);}
  .pill.off{background:rgba(248,81,73,.12); color:var(--bad); border:1px solid rgba(248,81,73,.4);}
  .pill.na{background:rgba(210,153,34,.12); color:var(--warn); border:1px solid rgba(210,153,34,.4);}
  .row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;
       border-top:1px solid #1a2230;}
  .row:first-of-type{border-top:none;}
  .row .k{color:var(--dim);}
  .row .v{font-variant-numeric:tabular-nums; text-align:right;}
  .dotlive{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dotlive.on{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .dotlive.off{background:var(--bad);}
  #broadcast{margin:16px 4px 8px; width:calc(100% - 8px); padding:16px; font-size:17px;
             font-weight:700; color:#fff; background:linear-gradient(135deg,#1f6feb,#388bfd);
             border:none; border-radius:var(--radius); cursor:pointer;}
  #broadcast:active{transform:scale(.98);}
  #broadcast:disabled{opacity:.5;}
  #bmsg{text-align:center; font-size:13px; color:var(--dim); min-height:20px; margin-bottom:10px;}
  .sess{font-size:12px; color:var(--dim); padding:4px 0;}
  .sess b{color:var(--txt);}
  footer{text-align:center; font-size:11px; color:var(--dim); padding:18px 0 8px;}
  .stub{font-size:11px; color:var(--warn); margin-top:8px;}
</style>
</head>
<body>

<header>
  <h1>MISSION<span class="dot">.</span>CONTROL</h1>
  <span id="updated">…</span>
</header>

<div class="grid" id="fleet"></div>

<button id="broadcast">📣 Broadcast alert to all devices</button>
<div id="bmsg"></div>

<footer>Seth's fleet · tailnet live · <span id="src">…</span></footer>

<script>
const LIVE = location.hostname !== 'kellner-dot.github.io'; // tailnet server = full actions
let STATUS_URL = LIVE ? '/api/status' : 'status.json';

async function load(){
  try{
    const r = await fetch(STATUS_URL, {cache:'no-store'});
    const j = await r.json();
    render(j);
  }catch(e){
    document.getElementById('fleet').innerHTML =
      '<div class="card"><h2>⚠️ collector offline</h2><div class="sub">status.json unreachable</div></div>';
  }
}

function pill(on, txt){
  return `<span class="pill ${on===true?'on':on===false?'off':'na'}">${txt||(on?'online':'offline')}</span>`;
}
function row(k,v){ return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }
function fmtUptime(s){
  if(s==null) return '—';
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h>0?`${h}h ${m}m`:`${m}m`;
}
function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  return s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;
}

function card(d){
  let body='';
  const dot=`<span class="dotlive ${d.online?'on':'off'}"></span>`;
  if(d.id==='seths-pc'){
    body = row('RVG agent', (d.rvg_version||'—')+(d.uptime_s!=null?` <span style="color:var(--dim)">(up ${fmtUptime(d.uptime_s)})</span>`:''))
      + row('Emby', d.emby&&d.emby.running?`✅ ${d.emby.version||''}`:'❌ down')
      + row('TeraBox uploaders', d.terabox_uploaders!=null?`${d.terabox_uploaders} running`:'—');
    if(d.emby_sessions && d.emby_sessions.length){
      body += `<div class="sess" style="margin-top:6px">Emby sessions:</div>`;
      d.emby_sessions.forEach(s=>{
        body += `<div class="sess">▶ <b>${esc(s.device||'?')}</b> · ${esc(s.client||'')} ${s.playing?`— <i>${esc(s.playing)}</i>`:'(idle)'}</div>`;
      });
    }
    // Fire TV Stick card lives inside the PC card (Emby-sourced)
    const ft = d.firetv||{};
    body += `<div class="sess" style="margin-top:8px;border-top:1px solid #1a2230;padding-top:8px">`
      + `📺 <b>Fire TV Stick 4K Select</b> ${ft.seen_in_emby?'· active in Emby':'· idle (not in Emby)'}<br>`
      + `<span style="font-size:11px">ADB: ${esc(ft.adb||'n/a')} — dashboard-side integration only</span></div>`;
  } else if(d.id==='seths-macbook-air'){
    body = row('BlueBubbles', d.bluebubbles&&d.bluebubbles.up?'✅ port 1234':'❌ down')
      + row('RVG Mac agent', d.rvg_agent&&d.rvg_agent.up?'✅ reachable':'❌ down')
      + `<div class="stub">Mac notifications: pending RVG Mac token</div>`;
  } else if(d.id==='iphone-xs-max'){
    body = row('Tailnet ping', d.ping_ms!=null?`${d.ping_ms} ms`:'—')
      + row('Push alerts', 'via ntfy ✅');
  } else if(d.id==='motorola-razr-2023'){
    body = row('RVG Android', d.rvg_agent&&d.rvg_agent.up?'✅ agent up':'❌ down')
      + row('Push alerts', 'via ntfy ✅');
  }
  return `<div class="card"><h2>${dot} ${esc(d.name)}</h2>
    <div class="sub">${esc(d.id)} · ${esc(d.ip||'')}</div>
    <div style="margin-bottom:8px">${pill(d.online)}</div>${body}</div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(j){
  document.getElementById('updated').textContent = 'updated ' + ago(j.generated_iso);
  document.getElementById('src').textContent = LIVE ? 'tailnet · live actions on' : 'public snapshot · read-only';
  document.getElementById('fleet').innerHTML = j.devices.map(card).join('');
  const b=document.getElementById('broadcast');
  if(!LIVE){ b.disabled=true; b.textContent='📣 Broadcast (tailnet only)'; }
}

document.getElementById('broadcast').addEventListener('click', async ()=>{
  const m=document.getElementById('bmsg'), b=document.getElementById('broadcast');
  const msg=prompt('Alert message for all devices:','Mission Control ping');
  if(msg==null) return;
  b.disabled=true; m.textContent='sending…';
  try{
    const r=await fetch('/api/broadcast',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const j=await r.json();
    m.textContent=j.ok?('✅ '+j.detail):('❌ '+(j.error||'failed'));
  }catch(e){ m.textContent='❌ relay unreachable'; }
  b.disabled=false;
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
