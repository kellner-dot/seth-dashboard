<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Mission Control TV</title>
<meta name="theme-color" content="#04060c">
<style>
  :root{
    --bg:#04060c;
    --txt:#f2f6fc; --dim:#a9b4c8; --faint:#5f6b85;
    --acc1:#6ee7ff; --acc2:#a78bfa; --acc3:#f472b6;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --focus:#6ee7ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg);
    font-size:26px;
    overflow-x:hidden;
  }
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1400px 700px at 12% -5%, rgba(110,231,255,.07), transparent 60%),
      radial-gradient(1200px 800px at 92% 8%, rgba(167,139,250,.08), transparent 60%),
      radial-gradient(1000px 900px at 50% 110%, rgba(244,114,182,.05), transparent 60%);}
  .orb{position:fixed; border-radius:50%; filter:blur(120px); opacity:.13; pointer-events:none; z-index:0;
       animation:drift 28s ease-in-out infinite alternate;}
  .orb.o1{width:440px;height:440px;left:-120px;top:4%;background:#2563eb;}
  .orb.o2{width:400px;height:400px;right:-110px;top:32%;background:#7c3aed;animation-delay:-9s;}
  .orb.o3{width:340px;height:340px;left:30%;bottom:-120px;background:#db2777;animation-delay:-18s;opacity:.09;}
  @keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(60px,80px) scale(1.12);}}

  .wrap{position:relative; z-index:1; padding-bottom:120px;}

  /* ============ slim top bar ============ */
  .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:16px 64px 14px;
    background:linear-gradient(180deg, rgba(4,6,12,.96) 0%, rgba(4,6,12,.82) 65%, transparent 100%);}
  .brand{display:flex; align-items:center; gap:20px;}
  .logo{width:64px; height:64px; border-radius:18px; display:grid; place-items:center; flex:none;
        background:conic-gradient(from 200deg,#0ea5e9,#8b5cf6,#ec4899,#0ea5e9);
        box-shadow:0 0 28px rgba(139,92,246,.45), inset 0 0 0 2px rgba(255,255,255,.25);
        animation:spinGlow 9s linear infinite;}
  @keyframes spinGlow{to{filter:hue-rotate(360deg);}}
  .logo svg{width:36px;height:36px;}
  .brand h1{margin:0; font-size:38px; letter-spacing:6px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 45%,var(--acc2) 75%,var(--acc3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .top-right{display:flex; align-items:center; gap:26px;}
  .live-badge{font-size:22px; font-weight:800; letter-spacing:2px; color:var(--ok);
    border:2px solid rgba(52,211,153,.45); border-radius:99px; padding:8px 22px;
    background:rgba(52,211,153,.08);}
  #clock{font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:2px; line-height:1;
         background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ============ hero banner ============ */
  .hero{position:relative; margin:6px 64px 0; border-radius:30px; overflow:hidden;
    min-height:470px; display:flex; align-items:flex-end;
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    background:#0a0f1c;}
  .hero-bg{position:absolute; inset:0;
    background:
      radial-gradient(900px 420px at 78% 20%, var(--hero-glow1, rgba(56,189,248,.20)), transparent 65%),
      radial-gradient(700px 380px at 15% 85%, var(--hero-glow2, rgba(139,92,246,.16)), transparent 65%),
      linear-gradient(115deg, #0c1322 0%, #0a0f1e 55%, #0d1226 100%);}
  .hero-bg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(4,6,12,.88) 0%, rgba(4,6,12,.45) 45%, transparent 75%);}
  .hero-art{position:absolute; right:70px; top:50%; transform:translateY(-50%); opacity:.9;
    width:300px; height:300px; display:grid; place-items:center;
    filter:drop-shadow(0 20px 60px rgba(0,0,0,.6));}
  .hero-art svg{width:230px; height:230px; animation:heroFloat 7s ease-in-out infinite;}
  @keyframes heroFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-16px) scale(1.03);}}
  .hero-content{position:relative; z-index:2; padding:52px 60px; max-width:1050px;}
  .hero-kicker{font-size:24px; font-weight:800; letter-spacing:6px; color:var(--acc1); margin-bottom:14px;
    text-transform:uppercase;}
  .hero-content h2{margin:0 0 10px; font-size:84px; font-weight:800; letter-spacing:1px; line-height:1.02;
    background:linear-gradient(180deg,#fff 30%,#b9c7de); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero-sub{font-size:32px; color:var(--dim); margin-bottom:18px; font-weight:600;}
  .hero-sub .ok{color:var(--ok);} .hero-sub .bad{color:var(--bad);} .hero-sub .warn{color:var(--warn);}
  .hero-stats{display:flex; gap:0; margin:6px 0 30px; flex-wrap:wrap;}
  .hstat{padding:6px 34px 6px 0; margin-right:34px; border-right:2px solid rgba(255,255,255,.10);}
  .hstat:last-child{border-right:none;}
  .hstat .n{font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hstat .u{display:block; font-size:21px; color:var(--faint); letter-spacing:2px; text-transform:uppercase; margin-top:6px;}
  .hero-bullets{list-style:none; margin:0 0 30px; padding:0;}
  .hero-bullets li{font-size:29px; padding:9px 0; color:var(--dim); line-height:1.4;}
  .hero-bullets li b{color:var(--txt);}
  .hero-actions{display:flex; gap:20px;}
  .hbtn{display:flex; align-items:center; gap:14px; font-size:30px; font-weight:800; letter-spacing:1px;
    color:#06121f; background:linear-gradient(180deg,#fff,#cfe3f5);
    border:none; border-radius:16px; padding:20px 44px; cursor:pointer; outline:none;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;}
  .hbtn.ghost{color:var(--txt); background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.22);}
  .hbtn.focused{transform:scale(1.07);
    box-shadow:0 0 0 4px rgba(110,231,255,.5), 0 14px 44px rgba(0,0,0,.5), 0 0 44px rgba(110,231,255,.3);}

  /* ============ rows ============ */
  #rows{margin-top:8px;}
  .row-sec{margin-top:38px;}
  .row-label{display:flex; align-items:center; gap:16px; padding:0 64px; margin-bottom:6px;}
  .row-label span{font-size:30px; font-weight:800; letter-spacing:5px; color:#cdd6e6; text-transform:uppercase; white-space:nowrap;}
  .row-label .cnt{font-size:22px; color:var(--faint); letter-spacing:2px; font-weight:600;}
  .row-viewport{overflow:hidden; padding:16px 64px 34px;}
  .row-track{display:flex; gap:26px; transition:transform .34s cubic-bezier(.2,.8,.2,1); will-change:transform;}

  /* ============ posters (16:9) ============ */
  .poster{flex:0 0 460px; border-radius:22px; overflow:hidden; background:#0b101d;
    border:3px solid rgba(255,255,255,.08);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .3s ease;
    outline:none; cursor:pointer;}
  .poster .art{position:relative; aspect-ratio:16/9; display:grid; place-items:center; overflow:hidden;
    background:var(--pbg, linear-gradient(135deg,#16213a,#0b1120));}
  .poster .art::before{content:""; position:absolute; inset:0;
    background:radial-gradient(420px 220px at 50% 120%, rgba(255,255,255,.07), transparent 70%);}
  .poster .art::after{content:""; position:absolute; inset:auto 0 0 0; height:44%;
    background:linear-gradient(transparent, rgba(4,6,12,.55));}
  .poster .art svg{width:118px; height:118px; position:relative; z-index:1;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
    transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .poster .pinfo{padding:20px 24px 22px; position:relative;}
  .poster .pt{display:flex; align-items:center; gap:12px; font-size:31px; font-weight:800; letter-spacing:.3px;}
  .poster .ps{font-size:23px; color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .poster .pstat{font-size:22px; color:var(--faint); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pdot{width:16px; height:16px; border-radius:50%; flex:none; display:inline-block;}
  .pdot.on{background:var(--ok); box-shadow:0 0 12px var(--ok); animation:pulse 2.2s ease-in-out infinite;}
  .pdot.off{background:var(--bad); box-shadow:0 0 10px rgba(248,113,113,.7);}
  .pdot.na{background:var(--warn); box-shadow:0 0 10px rgba(251,191,36,.7);}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;}50%{transform:scale(.72); opacity:.65;}}
  .poster.focused{transform:scale(1.08); border-color:var(--focus); z-index:5;
    box-shadow:0 0 0 4px rgba(110,231,255,.35), 0 26px 70px rgba(0,0,0,.65), 0 0 54px rgba(110,231,255,.22);}
  .poster.focused .art svg{transform:scale(1.12);}
  /* per-poster art gradients */
  .poster.k-server{--pbg:linear-gradient(135deg,#0e2a4a,#0b1120);}
  .poster.k-phone{--pbg:linear-gradient(135deg,#3b1f5e,#141021);}
  .poster.k-tv{--pbg:linear-gradient(135deg,#4a2c0e,#171006);}
  .poster.k-gh{--pbg:linear-gradient(135deg,#232c3d,#0c0f16);}
  .poster.k-am{--pbg:linear-gradient(135deg,#5e1030,#1c0a12);}
  .poster.k-artist{--pbg:linear-gradient(135deg,#4a1548,#160b1c);}
  .poster.k-emby{--pbg:linear-gradient(135deg,#0e3a5e,#0a1420);}
  .poster.k-tb{--pbg:linear-gradient(135deg,#0b4a44,#081512);}
  .poster.k-bt{--pbg:linear-gradient(135deg,#3d1f5e,#120e1e);}
  .poster.k-kg{--pbg:linear-gradient(135deg,#0b4a34,#081410);}
  .poster.k-cal{--pbg:linear-gradient(135deg,#5e3a0b,#181006);}
  .poster.k-act{--pbg:linear-gradient(135deg,#3a3f1a,#12100a);}
  .poster .pill{margin:10px 0 0;}
  .pill{display:inline-block; font-size:18px; font-weight:700; padding:7px 20px;
        border-radius:99px; text-transform:uppercase; letter-spacing:2px;}
  .pill.on{background:rgba(52,211,153,.13); color:var(--ok); border:2px solid rgba(52,211,153,.45);}
  .pill.off{background:rgba(248,113,113,.10); color:var(--bad); border:2px solid rgba(248,113,113,.4);}
  .pill.na{background:rgba(251,191,36,.10); color:var(--warn); border:2px solid rgba(251,191,36,.4);}

  /* detail rows inside overlay */
  .rowline{display:flex; justify-content:space-between; align-items:center; gap:14px;
       font-size:25px; padding:11px 0; border-top:2px solid rgba(255,255,255,.07);}
  .rowline .k{color:var(--dim); display:flex; align-items:center; gap:10px;}
  .rowline .v{font-variant-numeric:tabular-nums; text-align:right; font-weight:600;}
  .rowline .v .ok{color:var(--ok);} .rowline .v .bad{color:var(--bad);} .rowline .v .dim{color:var(--dim); font-weight:400;}
  .meter{height:10px; border-radius:99px; background:rgba(255,255,255,.09); margin-top:10px; overflow:hidden;}
  .meter > i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2)); box-shadow:0 0 12px rgba(110,231,255,.5);
    transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .meter.warn > i{background:linear-gradient(90deg,var(--warn),#f97316);}
  .meter.bad > i{background:linear-gradient(90deg,var(--bad),#ef4444);}
  .bigstat{display:flex; align-items:baseline; gap:12px; margin:10px 0 4px;}
  .bigstat .n{font-size:56px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .bigstat .u{font-size:24px; color:var(--dim);}
  .upl-dots{display:inline-flex; gap:8px; align-items:center;}
  .upl-dots i{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.12);}
  .upl-dots i.lit{background:var(--ok); box-shadow:0 0 12px var(--ok); animation:pulse 2.6s ease-in-out infinite;}
  .sess{font-size:23px; color:var(--dim); padding:9px 0 9px 4px; border-left:3px solid rgba(110,231,255,.35);
        margin:7px 0 7px 3px; padding-left:16px; line-height:1.4;}
  .sess b{color:var(--txt);}
  .sess .play{color:var(--acc1);}
  .sesslbl{font-size:20px; text-transform:uppercase; letter-spacing:2.5px; color:var(--faint); margin:16px 0 4px;}
  .stub{font-size:21px; color:var(--warn); margin-top:14px; padding:14px 16px; border-radius:14px; line-height:1.45;
        background:rgba(251,191,36,.07); border:2px dashed rgba(251,191,36,.35);}
  .adbline{font-size:21px; color:var(--dim); margin-top:12px; line-height:1.55;
           padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.03);
           border:2px solid rgba(255,255,255,.07);}
  .adbline b{color:var(--txt);}
  .cal-today{display:inline-block; font-size:18px; font-weight:800; letter-spacing:1.5px; color:#0a0e14;
    background:linear-gradient(90deg,#fcd34d,#fbbf24); border-radius:10px; padding:4px 14px; margin-left:12px;
    animation:pulse 2.4s ease-in-out infinite;}
  .check-item{display:flex; align-items:center; gap:12px; font-size:24px; padding:9px 0;
    border-top:2px solid rgba(255,255,255,.06);}
  .check-item .cb{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none;
    font-size:20px; font-weight:800;}
  .check-item.done .cb{background:rgba(52,211,153,.2); color:var(--ok); border:2px solid rgba(52,211,153,.5);}
  .check-item.todo .cb{background:rgba(255,255,255,.06); color:var(--faint); border:2px solid rgba(255,255,255,.18);}
  .check-item.done{color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(52,211,153,.5);}
  .check-bar{height:12px; border-radius:99px; background:rgba(255,255,255,.09); margin:12px 0 4px; overflow:hidden;}
  .check-bar > i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2)); transition:width .8s ease;}
  a.ext{color:var(--acc1); text-decoration:none; font-weight:600;}

  /* ============ detail overlay ============ */
  #overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(3,5,10,.84); backdrop-filter:blur(10px);}
  #overlay.open{display:flex; animation:ovIn .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes ovIn{from{opacity:0;}to{opacity:1;}}
  #ov-card{width:min(1150px, 86vw); max-height:86vh; overflow-y:auto;
    background:linear-gradient(165deg, rgba(28,36,54,.98), rgba(10,14,24,.98));
    border:1px solid rgba(110,231,255,.35); border-radius:28px; padding:46px 52px;
    box-shadow:0 40px 100px rgba(0,0,0,.75), 0 0 70px rgba(110,231,255,.12);
    animation:ovCardIn .32s cubic-bezier(.2,.9,.3,1.15);}
  @keyframes ovCardIn{from{transform:scale(.92) translateY(24px); opacity:0;}to{transform:none; opacity:1;}}
  #ov-card h2{font-size:50px; margin:0 0 6px;}
  #ov-card .osub{font-size:26px; color:var(--dim); margin-bottom:8px;}
  #ov-card .hint{font-size:22px; color:var(--faint); margin-top:28px; text-align:center;}
  #ov-card .rowline{font-size:30px; padding:14px 0;}
  #ov-card .sess{font-size:28px;}
  #ov-card .bigstat .n{font-size:76px;}
  #ov-card .bigstat .u{font-size:30px;}
  .ov-head{display:flex; align-items:center; gap:22px; margin-bottom:14px;}
  .ov-icon{width:96px; height:96px; border-radius:26px; display:grid; place-items:center; flex:none;
    background:linear-gradient(140deg, rgba(110,231,255,.18), rgba(167,139,250,.18));
    border:2px solid rgba(255,255,255,.14);}
  .ov-icon svg{width:56px; height:56px;}

  /* ============ notification center ============ */
  #notif-stack{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; flex-direction:column; gap:12px; width:min(1100px, 80vw); pointer-events:none;}
  .notif{pointer-events:auto; display:flex; align-items:center; gap:18px;
    background:linear-gradient(165deg, rgba(30,38,55,.97), rgba(12,17,28,.97));
    border:3px solid rgba(110,231,255,.4); border-radius:20px; padding:20px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(110,231,255,.12);
    animation:notifIn .35s cubic-bezier(.2,.9,.3,1.2); font-size:26px;}
  .notif.warn{border-color:rgba(251,191,36,.55); box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(251,191,36,.15);}
  .notif.critical{border-color:rgba(248,113,113,.6); box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(248,113,113,.2);
    animation:notifIn .35s cubic-bezier(.2,.9,.3,1.2), notifPulse 2s ease-in-out 1s infinite;}
  .notif.update{border-color:rgba(167,139,250,.6); box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 34px rgba(167,139,250,.25);}
  .notif .ni{font-size:40px; flex:none;}
  .notif .nt{font-weight:800; font-size:28px;}
  .notif .nm{color:var(--dim); font-size:23px; margin-top:4px;}
  .notif .nx{margin-left:auto; font-size:22px; color:var(--faint); flex:none; padding:8px 14px;
    border:2px solid rgba(255,255,255,.15); border-radius:12px;}
  @keyframes notifIn{from{transform:translateY(-40px) scale(.95); opacity:0;}to{transform:none; opacity:1;}}
  @keyframes notifPulse{0%,100%{box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(248,113,113,.2);}
    50%{box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 50px rgba(248,113,113,.4);}}
  .notif.out{transition:opacity .3s, transform .3s; opacity:0; transform:translateY(-20px);}

  /* ============ photo frame ============ */
  #photoframe{position:fixed; inset:0; z-index:70; display:none; background:#000;}
  #photoframe.open{display:block;}
  #pf-img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    transition:opacity 1.2s ease;}
  #pf-cap{position:absolute; bottom:0; left:0; right:0; padding:36px 60px 30px;
    background:linear-gradient(transparent, rgba(0,0,0,.75));
    display:flex; justify-content:space-between; align-items:flex-end;}
  #pf-cap .t{font-size:38px; font-weight:700;}
  #pf-cap .l{font-size:26px; color:var(--dim);}
  #pf-cap .c{font-size:22px; color:var(--faint);}
  #pf-hint{position:absolute; top:24px; right:36px; font-size:22px; color:rgba(255,255,255,.5);}

  /* ============ now playing strip ============ */
  #nowplaying{display:none; align-items:center; gap:18px; margin:14px 64px 0; padding:18px 28px;
    background:linear-gradient(135deg, rgba(45,27,78,.85), rgba(26,26,46,.85));
    border:1px solid rgba(167,139,250,.35); border-radius:18px; font-size:28px;}
  #nowplaying .npb{width:14px; height:44px; border-radius:8px; flex:none;
    background:linear-gradient(180deg,var(--acc2),var(--acc3)); box-shadow:0 0 18px rgba(167,139,250,.6);
    animation:pulse 1.8s ease-in-out infinite;}

  #hint{position:fixed; bottom:14px; left:0; right:0; text-align:center; z-index:5;
        font-size:20px; color:var(--faint); letter-spacing:1px;
        background:linear-gradient(transparent, rgba(4,6,12,.9) 40%); padding:26px 0 6px;}
  #hint b{color:var(--dim);}
  footer{text-align:center; font-size:19px; color:var(--faint); padding:10px 0 0; letter-spacing:.4px;}
  footer .live-tag{color:var(--ok);}
  .err-hero{text-align:center; padding:80px 40px;}
  .err-hero .big{font-size:80px; margin-bottom:16px;}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="wrap">
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2" fill="rgba(255,255,255,.9)" stroke="none"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(38 12 12)" opacity=".55"/>
        <circle cx="19.5" cy="7.5" r="1.3" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <h1>MISSION CONTROL</h1>
  </div>
  <div class="top-right">
    <div class="live-badge"><span id="live-dot">●</span> <span id="live-txt">LIVE</span></div>
    <div id="clock">--:--:--</div>
  </div>
</header>

<script>
/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pill(on, txt){
  return `<span class="pill ${on===true?'on':on===false?'off':'na'}">${txt||(on?'online':'offline')}</span>`;
}
function rowline(k,v){ return `<div class="rowline"><span class="k">${k}</span><span class="v">${v}</span></div>`; }
function fmtUptime(s){
  if(s==null) return '—';
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d>0?`${d}d ${h}h`:(h>0?`${h}h ${m}m`:`${m}m`);
}
function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  return s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;
}
function fmtBytes(b){
  if(b==null||isNaN(b)) return '—';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return `${b>=100?Math.round(b):b.toFixed(1)} ${u[i]}`;
}
function meter(pct, cls){
  const p=Math.max(0,Math.min(100,pct));
  return `<div class="meter ${cls||''}"><i style="width:${p}%"></i></div>`;
}
function sigBars(ping){
  const bars = ping==null?0:(ping<80?4:ping<200?3:ping<500?2:1);
  let s='';
  for(let i=0;i<4;i++) s+=`<i style="height:${10+i*6}px;width:9px;border-radius:3px;display:inline-block;background:${i<bars?'var(--ok)':'rgba(255,255,255,.12)'}"></i>`;
  return `<span style="display:inline-flex;gap:6px;align-items:flex-end">${s}</span>`;
}


/* ---------- card builders (each returns {id,title,cls,icon,head,body,detail}) ---------- */
function pcCard(d){
  const dot=`<span class="dotlive ${d.online?'on':'off'}"></span>`;
  const embyOk = d.emby && d.emby.running;
  const up = d.terabox_uploaders||0;
  let dots=''; for(let i=0;i<4;i++) dots+=`<i class="${i<up?'lit':''}"></i>`;
  const sess=(d.emby_sessions||[]).map(s=>
    `<div class="sess"><b>${esc(s.device||'?')}</b> <span class="dim">· ${esc(s.client||'')}</span>`+
    (s.playing?`<br><span class="play">▶ ${esc(s.playing)}</span>`:`<br><span class="dim">(idle)</span>`)+`</div>`).join('');
  const body =
      rowline('🛰️ RVG agent', `<span class="${d.online?'ok':'bad'}">${esc(d.rvg_version||'—')}</span>`)
    + rowline('⏱️ Uptime', `<b>${fmtUptime(d.uptime_s)}</b>`)
    + meter(d.uptime_s!=null?Math.min(100,(d.uptime_s/86400)*100):0)
    + rowline('🎬 Emby', embyOk?`<span class="ok">● ${esc(d.emby.version||'')}</span>`:'<span class="bad">● down</span>')
    + rowline('☁️ Uploaders', `<span class="upl-dots">${dots}</span> <b>${up}</b>`)
    + (sess?`<div class="sesslbl">▶ Now playing</div>${sess}`:'');
  return {id:'pc', cls:'k-server', icon:'server', title:esc(d.name), sub:`${esc(d.hostname||d.id)} · ${esc(d.ip||'')}`,
    dot, pill:pill(d.online), body, detail:body};
}

function macCard(d){
  const dot=`<span class="dotlive ${d.online?'on':d.online===false?'off':'na'}"></span>`;
  const bb = d.bluebubbles && d.bluebubbles.up;
  const rvg = d.rvg_agent && d.rvg_agent.up;
  const body =
      rowline('💬 BlueBubbles', bb?'<span class="ok">● port 1234</span>':'<span class="bad">● down</span>')

/* ---------- Phase 1: Notification Center ---------- */
let seenAlertIds = new Set();
try{ (JSON.parse(localStorage.getItem('mc_seen_alerts')||'[]')).forEach(id=>seenAlertIds.add(id)); }catch(e){}
function alertId(a){ return (a.title||'')+'|'+(a.at||''); }

function showNotif(a){
  const stack = document.getElementById('notif-stack');
  const el = document.createElement('div');
  el.className = 'notif ' + (a.severity==='critical'?'critical':a.severity==='warn'?'warn':'');
  el.innerHTML = `<div class="ni">${a.icon||'🔔'}</div>
    <div><div class="nt">${esc(a.title||'Notification')}</div>
    <div class="nm">${esc(a.message||'')}</div></div>
    <div class="nx">BACK ✕</div>`;
  const dismiss = ()=>{
    el.classList.add('out');
    setTimeout(()=>el.remove(), 350);
    seenAlertIds.add(alertId(a));
    try{ localStorage.setItem('mc_seen_alerts', JSON.stringify([...seenAlertIds].slice(-50))); }catch(e){}
  };
  el.querySelector('.nx').onclick = dismiss;
  el.onclick = (e)=>{ if(e.target.closest('.nx')) return; dismiss(); };
  stack.appendChild(el);
  // auto-dismiss after 12s (critical stays until dismissed)
  if(a.severity!=='critical') setTimeout(()=>{ if(el.parentNode) dismiss(); }, 12000);
  // cap stack at 3
  while(stack.children.length>3) stack.firstChild.remove();
}

function processAlerts(alerts){
  (alerts||[]).forEach(a=>{
    if(!seenAlertIds.has(alertId(a))) showNotif(a);
  });
}

      return d.ping_ms!=null ? `${d.ping_ms} ms ping · ntfy` : 'online · ntfy'; }

    case 'emby': { const l=j.emby_library||{}; return `${l.movies!=null?l.movies:'—'} movies · ${l.series!=null?l.series:'—'} series`; }
    case 'terabox': { const t=j.terabox||{}; const has=t.total!=null&&t.used!=null;

    case 'kaviguard': { const kg=j.kaviguard||{}; return Object.keys(kg).length ? 'shield up' : 'syncing'; }

      const days=Math.max(0,Math.ceil((target-new Date())/86400000)); return `${days} days to go`; }

  document.getElementById('collector').textContent = (j.collector||'—').replace(/\s*\(.*\)/,'');

  const byId={}; (j.devices||[]).forEach(d=>byId[d.id]=d);
  const ctx={ pc:byId['seths-pc'], mac:byId['seths-macbook-air'], iphone:byId['iphone-xs-max'], razr:byId['motorola-razr-2023'] };

  const fleet=[];
  if(ctx.pc) fleet.push(pcCard(ctx.pc));
  if(ctx.mac) fleet.push(macCard(ctx.mac));
  if(ctx.iphone) fleet.push(phoneCard(ctx.iphone));
  if(ctx.razr) fleet.push(phoneCard(ctx.razr));
  fleet.push(fireTvCard(ctx.pc && ctx.pc.firetv, ctx.pc));

  const media=[
    embyCard(j.emby_library, ctx.pc && ctx.pc.emby_sessions),
    teraboxCard(j.terabox, ctx.pc && ctx.pc.terabox_uploaders),
    biglybtCard(j.biglybt),
    appleMusicCard(),
    artistCard(),
  ];

  const ops=[
    githubCard(j.github),
    kaviguardCard(j.kaviguard),
    calendarCard(),
    hearingCard(),
  ];

  ROWS=[
    {label:'My Fleet', cards:fleet},
    {label:'Media', cards:media},
    {label:'Operations', cards:ops},
    {label:'Quick Actions', cards:actionCards()},
  ];

  renderHero(j, ctx);
  processAlerts(j.alerts);

  const keep = currentCard();
  const keepId = keep && keep.id;
  document.getElementById('rows').innerHTML = ROWS.map((r,ri)=>
    `<section class="row-sec" data-sec="${ri}">
       <div class="row-label"><span>${r.label}</span><span class="cnt">${r.cards.length}</span></div>
       <div class="row-viewport"><div class="row-track" data-row="${ri}">`+
         r.cards.map(c=>posterHTML(c,j,ctx)).join('')+
       `</div></div>
     </section>`).join('');

  // restore focus
  if(keepId){
    outer: for(let ri=0;ri<ROWS.length;ri++){
      const ci=ROWS[ri].cards.findIndex(c=>c.id===keepId);
      if(ci>=0){ focus={zone:'rows',r:ri,c:ci}; break outer; }
    }
  }
  if(focus.zone==='rows'){
    focus.r=Math.min(focus.r, ROWS.length-1);
    focus.c=Math.min(focus.c, ROWS[focus.r].cards.length-1);
  }
  rowX = ROWS.map(()=>0);
  applyFocus(true);
}

function currentCard(){
  if(focus.zone!=='rows'||!ROWS.length) return null;
  return ROWS[focus.r].cards[focus.c];
}

/* ---------- focus + translateX row scrolling ---------- */
function applyFocus(instant){
  document.querySelectorAll('.poster.focused').forEach(el=>el.classList.remove('focused'));
  document.querySelectorAll('.hbtn.focused').forEach(el=>el.classList.remove('focused'));
  if(focus.zone==='hero'){
    const btn=document.querySelector(`[data-ha="${focus.c}"]`);
    if(btn){ btn.classList.add('focused'); btn.scrollIntoView({block:'nearest', behavior:instant?'auto':'smooth'}); }
    return;
  }
  const c=currentCard(); if(!c) return;
  const el=document.querySelector(`.poster[data-id="${c.id}"]`);
  if(!el) return;
  el.classList.add('focused');
  // translateX scroll: center focused poster in viewport
  const track=document.querySelector(`.row-track[data-row="${focus.r}"]`);
  const viewport=track.parentElement;
  const pw=el.offsetWidth+26; // poster + gap
  const vpW=viewport.clientWidth;
  let x = 64 + focus.c*pw + pw/2 - vpW/2;
  const maxX=Math.max(0, track.scrollWidth - vpW);
  x=Math.max(0, Math.min(maxX, x));
  rowX[focus.r]=x;
  if(instant) track.style.transition='none';
  track.style.transform=`translateX(${-x}px)`;
  if(instant){ void track.offsetWidth; track.style.transition=''; }
  // vertical: keep row visible
  const sec=el.closest('.row-sec');
  if(sec) sec.scrollIntoView({block:'nearest', behavior:instant?'auto':'smooth'});
}

function move(dr, dc){
  if(!ROWS.length) return;
  closeOverlay();
  if(focus.zone==='hero'){
    if(dc!==0){
      focus.c=Math.max(0,Math.min(heroActions.length-1,focus.c+dc));
    } else if(dr>0){
      focus={zone:'rows',r:0,c:Math.min(focus.c,ROWS[0].cards.length-1)};
    }
    applyFocus(); return;
  }
  let r=focus.r+dr, c=focus.c+dc;
  if(dr<0 && r<0){ focus={zone:'hero',r:0,c:0}; applyFocus(); return; }
  r=Math.max(0,Math.min(ROWS.length-1,r));
  c=Math.max(0,Math.min(ROWS[r].cards.length-1,c));
  focus={zone:'rows',r,c};
  applyFocus();
}

/* ---------- overlay ---------- */
function openOverlay(){
  let icon='bolt', title='', sub='', dot='', pillHtml='', detail='';
  if(focus.zone==='hero'){
    const s=heroSubject; if(!s) return;
    if(s.type==='device'&&s.card){ ({icon,title,sub,dot}=s.card); pillHtml=s.card.pill; detail=s.card.detail; }
    else if(s.type==='briefing'){
      const b=briefingData||{headline:'Kavi Briefing',greeting:'',bullets:[],one_thing:''};
      icon='bolt'; title=b.headline||'Kavi Briefing'; sub='morning digest'; dot='<span class="dotlive on"></span>';
      pillHtml=pill('on','briefing');
      detail=`<div style="font-size:30px;color:var(--dim);margin-bottom:14px">${esc(b.greeting||'')}</div>`+
        `<ul style="list-style:none;margin:10px 0;padding:0">`+(b.bullets||[]).map(x=>`<li style="font-size:30px;padding:12px 0;border-top:2px solid rgba(255,255,255,.07)">${esc(x)}</li>`).join('')+`</ul>`+
        (b.one_thing?`<div style="margin-top:16px;padding:18px 20px;border-radius:16px;font-size:30px;background:rgba(251,191,36,.08);border:2px solid rgba(251,191,36,.35)"><b style="color:var(--warn)">☝️ One thing:</b> ${esc(b.one_thing)}</div>`:'');
    }
    else if(s.type==='nowplaying'&&s.item){
      const it=s.item; icon='film'; title=it.title||'Now Playing'; sub=[it.series,it.user,it.device].filter(Boolean).join(' · ');
      dot='<span class="dotlive on"></span>'; pillHtml=pill('on','playing');
      detail=rowline('🎬 Title',`<b>${esc(it.title||'—')}</b>`)+rowline('📺 Progress', it.progress_pct!=null?Math.round(it.progress_pct)+'%':'—');
    }
  } else {
    const c=currentCard(); if(!c||c.isAction) return;
    ({icon,title,sub,dot}=c); pillHtml=c.pill; detail=c.detail;
  }
  document.getElementById('ov-card').innerHTML=
    `<div class="ov-head"><div class="ov-icon">${ICONS[icon]||''}</div>
     <div><h2>${title}</h2><div class="osub">${sub||''}</div></div>
     <div style="flex:1"></div>${dot}</div>
     <div>${pillHtml}</div>${detail}
     <div class="hint">Press <b>Back</b> to close</div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('open'); }
function overlayOpen(){ return document.getElementById('overlay').classList.contains('open'); }

/* ---------- hero + card actions ---------- */
function runHeroAction(i){
  const a=heroActions[i]; if(!a) return;
  if(a.id==='hero-details') openOverlay();
  else if(a.id==='hero-photos') openPhotoFrame();
}
function runCardAction(c){
  if(!c||!c.isAction) return;
  if(c.isAction==='photos') openPhotoFrame();
  else if(c.isAction==='iptv'){ window.location.href='../iptv/'; }
  else if(c.isAction==='refresh'){ load(); }
}

/* ---------- auto-update check ---------- */
async function checkForUpdate(){
  try{
    const m=/[?&](?:b|appBuild)=(\d+)/.exec(location.search);
    if(!m) return;
    const r=await fetch('version.json',{cache:'no-store'});
    if(!r.ok) return;
    const v=await r.json();
    const latest=v.missioncontrol&&v.missioncontrol.build;
    if(latest&&latest>parseInt(m[1],10)){
      const stack=document.getElementById('notif-stack');
      const el=document.createElement('div');
      el.className='notif update';
      el.innerHTML=`<div class="ni">🔄</div><div><div class="nt">Update available — Build ${latest}</div>`+
        `<div class="nm">Relaunch Mission Control from the Fire TV home screen to get the latest.</div></div>`+
        `<div class="nx">BACK ✕</div>`;
      const dismiss=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),350); };
      el.querySelector('.nx').onclick=dismiss;
      stack.appendChild(el);
    }
  }catch(e){}
}

/* ---------- DPAD / keyboard ---------- */
document.addEventListener('keydown', e=>{
  const k=e.key;
  if(photoFrameOpen()){
    if(k==='ArrowLeft'){ pfNav(-1); e.preventDefault(); return; }
    if(k==='ArrowRight'){ pfNav(1); e.preventDefault(); return; }
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){ closePhotoFrame(); e.preventDefault(); return; }
    return;
  }
  if(overlayOpen()){
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){ closeOverlay(); e.preventDefault(); }
    return;
  }
  if(k==='Escape'||k==='Backspace'){
    const stack=document.getElementById('notif-stack');
    if(stack.children.length>0){ stack.firstChild.querySelector('.nx').click(); e.preventDefault(); return; }
  }
  switch(k){
    case 'ArrowLeft': move(0,-1); e.preventDefault(); break;
    case 'ArrowRight': move(0,1); e.preventDefault(); break;
    case 'ArrowUp': move(-1,0); e.preventDefault(); break;
    case 'ArrowDown': move(1,0); e.preventDefault(); break;
    case 'Enter':
      if(focus.zone==='hero') runHeroAction(focus.c);
      else { const c=currentCard(); if(c&&c.isAction) runCardAction(c); else openOverlay(); }
      e.preventDefault(); break;
    case 'p': case 'P': openPhotoFrame(); e.preventDefault(); break;
    case 'Escape': case 'Backspace': e.preventDefault(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.keyCode===10009||e.keyCode===461){
    if(photoFrameOpen()){ closePhotoFrame(); e.preventDefault(); }
    else if(overlayOpen()){ closeOverlay(); e.preventDefault(); }
    else {
      const stack=document.getElementById('notif-stack');
      if(stack.children.length>0){ stack.firstChild.querySelector('.nx').click(); e.preventDefault(); }
    }
  }
});

/* ---------- data ---------- */
// Send to TV: poll inbox, open new URLs
function renderNowPlaying(np){
  const el = document.getElementById('nowplaying');
  if(!np || !Array.isArray(np.items) || np.items.length === 0){
    el.style.display = 'none';
    return;
  }
  const item = np.items[0];
  document.getElementById('np-icon').textContent = item.icon || '🎬';
  document.getElementById('np-title').textContent = item.title || 'Unknown';
  const sub = [];
  if(item.series) sub.push(item.series);
  if(item.user) sub.push(item.user);
  if(item.device) sub.push(item.device);
  document.getElementById('np-sub').textContent = sub.join(' · ');
  document.getElementById('np-progress').textContent =
    item.progress_pct ? Math.round(item.progress_pct) + '%' : '';
  el.style.display = 'flex';
}

function checkInbox(inbox){
  if(!inbox || !Array.isArray(inbox.items)) return;
  let seen = [];
  try{ seen = JSON.parse(localStorage.getItem('tv_seen_inbox') || '[]'); }catch(e){}
  const fresh = inbox.items.filter(it => it && it.id && it.url && !seen.includes(it.id));
  if(fresh.length === 0) return;
  seen = seen.concat(fresh.map(it => it.id)).slice(-50);
  try{ localStorage.setItem('tv_seen_inbox', JSON.stringify(seen)); }catch(e){}
  const item = fresh[fresh.length - 1];
  showInboxBanner(item.url);
  setTimeout(()=>{ window.location.href = item.url; }, 3000);
}
function showInboxBanner(url){
  let el = document.getElementById('inbox-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'inbox-banner';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#6c3ce0;color:#fff;padding:20px 32px;border-radius:12px;font-size:28px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
    document.body.appendChild(el);
  }
  el.textContent = '📲 Opening: ' + (url.length > 60 ? url.slice(0,60) + '...' : url);
  el.style.display = 'block';
}

async function load(){
  try{
    const [r,b,h,p,ib,np]=await Promise.all([
      fetch(STATUS_URL,{cache:'no-store'}),
      fetch('briefing.json',{cache:'no-store'}).catch(()=>null),
      fetch('hearing.json',{cache:'no-store'}).catch(()=>null),
      fetch('photos.json',{cache:'no-store'}).catch(()=>null),
      fetch('../tv-inbox/inbox.json',{cache:'no-store'}).catch(()=>null),
      fetch('nowplaying.json',{cache:'no-store'}).catch(()=>null),
    ]);
    const j=await r.json();
    try{ if(b&&b.ok) briefingData=await b.json(); }catch(e){}
    try{ if(h&&h.ok) hearingData=await h.json(); }catch(e){}
    try{ if(p&&p.ok) photosData=await p.json(); }catch(e){}
    try{ if(ib&&ib.ok) checkInbox(await ib.json()); }catch(e){}
    try{ if(np&&np.ok){ npData=await np.json(); renderNowPlaying(npData); } }catch(e){}
    render(j);
    checkForUpdate();
  }catch(e){
    document.getElementById('rows').innerHTML=
      `<div class="err-hero"><div class="big">🛰️</div>
       <h2 style="margin:0 0 6px;font-size:54px">collector offline</h2>
       <div style="font-size:28px;color:var(--dim)">status.json unreachable — check the 5-min cron</div></div>`;
  }
}

function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick,1000);

load();
setInterval(load, 30000);
</script>
