<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mission Control</title>
<meta name="theme-color" content="#05070d">
<style>
  :root{
    --bg:#05070d;
    --txt:#eef3fa; --dim:#8b98ad; --faint:#5b6577;
    --acc1:#6ee7ff; --acc2:#a78bfa; --acc3:#f472b6;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --radius:20px;
    --card-brd:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -5%, rgba(110,231,255,.07), transparent 60%),
      radial-gradient(1000px 700px at 90% 10%, rgba(167,139,250,.08), transparent 60%),
      radial-gradient(900px 900px at 50% 110%, rgba(244,114,182,.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* floating ambient orbs */
  .orb{position:fixed; border-radius:50%; filter:blur(90px); opacity:.16; pointer-events:none; z-index:0;
       animation:drift 26s ease-in-out infinite alternate;}
  .orb.o1{width:340px;height:340px;left:-90px;top:8%;background:#2563eb;}
  .orb.o2{width:300px;height:300px;right:-80px;top:38%;background:#7c3aed;animation-delay:-9s;}
  .orb.o3{width:260px;height:260px;left:30%;bottom:-90px;background:#db2777;animation-delay:-17s;opacity:.10;}
  @keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(40px,60px) scale(1.12);}}

  .wrap{position:relative; z-index:1; max-width:1060px; margin:0 auto;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:12px;
         padding:22px 6px 16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px;}
  .logo{width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
        background:conic-gradient(from 200deg,#0ea5e9,#8b5cf6,#ec4899,#0ea5e9);
        box-shadow:0 0 26px rgba(139,92,246,.45), inset 0 0 0 2px rgba(255,255,255,.25);
        animation:spinGlow 9s linear infinite;}
  @keyframes spinGlow{to{filter:hue-rotate(360deg);}}
  .logo svg{width:30px;height:30px;}
  .brand h1{margin:0; font-size:clamp(20px,4.5vw,27px); letter-spacing:3px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 45%,var(--acc2) 75%,var(--acc3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .tag{margin:2px 0 0; font-size:12px; color:var(--dim); letter-spacing:.4px;}
  .hdr-right{text-align:right;}
  #clock{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:1px;
         background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  #updated{font-size:11px; color:var(--dim); margin-top:2px;}
  #updated .fresh{color:var(--ok);}

  /* ---------- fleet grid ---------- */
  .grid{display:grid; gap:14px; grid-template-columns:1fr; margin-top:6px;}
  @media(min-width:680px){ .grid{grid-template-columns:1fr 1fr;} }
  @media(min-width:1020px){ .grid{grid-template-columns:1fr 1fr 1fr;} }

  .card{
    position:relative; overflow:hidden;
    background:linear-gradient(165deg, rgba(255,255,255,.065), rgba(255,255,255,.018) 55%, rgba(255,255,255,.04));
    border:1px solid var(--card-brd);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 34px rgba(0,0,0,.42);
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation:rise .5s ease both;
  }
  .card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
  .card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}
  .card:nth-child(6){animation-delay:.30s}.card:nth-child(7){animation-delay:.36s}
  .card:nth-child(8){animation-delay:.42s}
  /* section labels */
  .seclabel{display:flex; align-items:center; gap:12px; margin:22px 4px 2px;}
  .seclabel:first-child{margin-top:8px;}
  .seclabel span{font-size:11px; font-weight:800; letter-spacing:3px; color:var(--faint); text-transform:uppercase;}
  .seclabel::after{content:""; flex:1; height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,.14), transparent);}
  @keyframes rise{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
  .card:hover{transform:translateY(-4px); border-color:rgba(255,255,255,.18);
              box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 24px rgba(139,92,246,.12);}
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:3px;
    background:var(--stripe, linear-gradient(90deg,var(--acc1),var(--acc2)));}
  .card.k-server{--stripe:linear-gradient(90deg,#38bdf8,#6366f1);}
  .card.k-phone{--stripe:linear-gradient(90deg,#a78bfa,#f472b6);}
  .card.k-tv{--stripe:linear-gradient(90deg,#fbbf24,#f97316);}
  .card.k-gh{--stripe:linear-gradient(90deg,#e6edf3,#8b949e);}
  .card.k-am{--stripe:linear-gradient(90deg,#fa2d48,#fc5c72);}
  .card.k-artist{--stripe:linear-gradient(90deg,#fb7185,#c026d3);}
  .card.k-emby{--stripe:linear-gradient(90deg,#38bdf8,#818cf8);}
  .card.k-tb{--stripe:linear-gradient(90deg,#5eead4,#38bdf8);}
  .card.k-bt{--stripe:linear-gradient(90deg,#f0abfc,#a78bfa);}
  .card.k-kg{--stripe:linear-gradient(90deg,#86efac,#34d399);}
  .card.k-act{--stripe:linear-gradient(90deg,#fca5a5,#f97316);}
  .card.k-cal{--stripe:linear-gradient(90deg,#fcd34d,#fbbf24);}

  .chead{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .icon-tile{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; flex:none;
    background:linear-gradient(140deg, rgba(110,231,255,.20), rgba(167,139,250,.20));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.35);}
  .icon-tile svg{width:26px; height:26px;}
  .card.k-phone .icon-tile{background:linear-gradient(140deg, rgba(167,139,250,.22), rgba(244,114,182,.20));}
  .card.k-tv .icon-tile{background:linear-gradient(140deg, rgba(251,191,36,.22), rgba(249,115,22,.20));}
  .card.k-gh .icon-tile{background:linear-gradient(140deg, rgba(230,237,243,.16), rgba(139,148,158,.16));}
  .card.k-am .icon-tile{background:linear-gradient(140deg, rgba(250,45,72,.24), rgba(252,92,114,.20));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px rgba(250,45,72,.35);}
  .card.k-artist .icon-tile{background:linear-gradient(140deg, rgba(251,113,133,.22), rgba(192,38,211,.20));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 14px rgba(192,38,211,.30);}
  .card.k-emby .icon-tile{background:linear-gradient(140deg, rgba(56,189,248,.22), rgba(129,140,248,.20));}
  .card.k-tb .icon-tile{background:linear-gradient(140deg, rgba(94,234,212,.20), rgba(56,189,248,.20));}
  .card.k-bt .icon-tile{background:linear-gradient(140deg, rgba(240,171,252,.20), rgba(167,139,250,.20));}
  .card.k-kg .icon-tile{background:linear-gradient(140deg, rgba(134,239,172,.20), rgba(52,211,153,.20));}
  .card.k-act .icon-tile{background:linear-gradient(140deg, rgba(252,165,165,.20), rgba(249,115,22,.20));}
  .card.k-cal .icon-tile{background:linear-gradient(140deg, rgba(252,211,77,.20), rgba(251,191,36,.20));}
  a.ext{color:var(--acc1); text-decoration:none; font-weight:600;}
  a.ext:hover{text-decoration:underline;}
  .chead h2{margin:0; font-size:17px; font-weight:700; letter-spacing:.3px;}
  .chead .sub{font-size:11.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums;}
  .chead .spacer{flex:1;}

  /* pulsing status dot */
  .dotlive{width:11px; height:11px; border-radius:50%; display:inline-block; flex:none;}
  .dotlive.on{background:var(--ok); box-shadow:0 0 10px var(--ok); animation:pulse 2.2s ease-in-out infinite;}
  .dotlive.off{background:var(--bad); box-shadow:0 0 8px rgba(248,113,113,.7);}
  .dotlive.na{background:var(--warn); box-shadow:0 0 8px rgba(251,191,36,.7); animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;}50%{transform:scale(.72); opacity:.65;}}

  .pill{display:inline-block; font-size:10.5px; font-weight:700; padding:4px 12px; margin:8px 0 4px;
        border-radius:99px; text-transform:uppercase; letter-spacing:1px;}
  .pill.on{background:rgba(52,211,153,.13); color:var(--ok); border:1px solid rgba(52,211,153,.45);
            box-shadow:0 0 14px rgba(52,211,153,.12);}
  .pill.off{background:rgba(248,113,113,.10); color:var(--bad); border:1px solid rgba(248,113,113,.4);}
  .pill.na{background:rgba(251,191,36,.10); color:var(--warn); border:1px solid rgba(251,191,36,.4);}

  .row{display:flex; justify-content:space-between; align-items:center; gap:10px;
       font-size:13px; padding:7px 0; border-top:1px solid rgba(255,255,255,.06);}
  .row .k{color:var(--dim); display:flex; align-items:center; gap:7px;}
  .row .v{font-variant-numeric:tabular-nums; text-align:right; font-weight:600;}
  .row .v .ok{color:var(--ok);} .row .v .bad{color:var(--bad);} .row .v .dim{color:var(--dim); font-weight:400;}

  /* mini meter bars */
  .meter{height:5px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:6px; overflow:hidden;}
  .meter > i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2)); box-shadow:0 0 10px rgba(110,231,255,.5);
    transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .meter.warn > i{background:linear-gradient(90deg,var(--warn),#f97316);}
  .meter.bad > i{background:linear-gradient(90deg,var(--bad),#ef4444);}

  .upl-dots{display:inline-flex; gap:5px; align-items:center;}
  .upl-dots i{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.12);}
  .upl-dots i.lit{background:var(--ok); box-shadow:0 0 8px var(--ok); animation:pulse 2.6s ease-in-out infinite;}

  .sess{font-size:12px; color:var(--dim); padding:5px 0 5px 2px; border-left:2px solid rgba(110,231,255,.35);
        margin:4px 0 4px 2px; padding-left:10px;}
  .sess b{color:var(--txt);}
  .sess .play{color:var(--acc1);}
  .sesslbl{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--faint); margin:10px 0 2px;}
  .stub{font-size:11px; color:var(--warn); margin-top:10px; padding:8px 10px; border-radius:10px;
        background:rgba(251,191,36,.07); border:1px dashed rgba(251,191,36,.35);}
  .adbline{font-size:11.5px; color:var(--dim); margin-top:8px; line-height:1.5;
           padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.03);
           border:1px solid rgba(255,255,255,.07);}
  .adbline b{color:var(--txt);}

  /* ---------- broadcast ---------- */
  #broadcast{margin:20px 2px 6px; width:calc(100% - 4px); padding:17px; font-size:16.5px; font-weight:800;
    letter-spacing:.5px; color:#fff; cursor:pointer;
    background:linear-gradient(120deg,#2563eb,#7c3aed 55%,#db2777);
    background-size:180% 180%;
    border:1px solid rgba(255,255,255,.18); border-radius:16px;
    box-shadow:0 10px 30px rgba(124,58,237,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .15s ease, box-shadow .2s ease, background-position .6s ease;}
  #broadcast:hover:not(:disabled){background-position:90% 50%; box-shadow:0 14px 38px rgba(124,58,237,.5);}
  #broadcast:active:not(:disabled){transform:scale(.98);}
  #broadcast:disabled{opacity:.45; cursor:not-allowed; filter:saturate(.4);}
  #bmsg{text-align:center; font-size:13px; color:var(--dim); min-height:22px; margin-bottom:8px;}
  /* quick actions */
  .qbtn{display:flex; align-items:center; gap:10px; width:100%; margin:7px 0; padding:13px 14px;
    font-size:14px; font-weight:700; color:var(--txt); cursor:pointer; text-align:left;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12); border-radius:13px;
    transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;}
  .qbtn:hover:not(:disabled){border-color:rgba(252,165,165,.5); box-shadow:0 0 18px rgba(249,115,22,.18); transform:translateX(3px);}
  .qbtn:active:not(:disabled){transform:scale(.98);}
  .qbtn:disabled{opacity:.45; cursor:not-allowed;}
  .qbtn .qi{font-size:18px;}
  .qbtn small{display:block; font-size:11px; font-weight:400; color:var(--dim);}
  #qmsg{font-size:12px; color:var(--dim); min-height:18px; margin-top:6px; text-align:center;}
  /* big storage stat */
  .bigstat{display:flex; align-items:baseline; gap:8px; margin:6px 0 2px;}
  .bigstat .n{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .bigstat .u{font-size:13px; color:var(--dim);}
  .cal-today{display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px; color:#0a0e14;
    background:linear-gradient(90deg,#fcd34d,#fbbf24); border-radius:6px; padding:2px 8px; margin-left:8px;
    animation:pulse 2.4s ease-in-out infinite;}

  footer{text-align:center; font-size:11px; color:var(--faint); padding:16px 0 10px; letter-spacing:.4px;}
  footer .live-tag{color:var(--ok);}
  .err-card{text-align:center; padding:26px 18px;}
  .err-card .big{font-size:34px; margin-bottom:8px;}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="wrap">
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2" fill="rgba(255,255,255,.9)" stroke="none"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(38 12 12)" opacity=".55"/>
        <circle cx="19.5" cy="7.5" r="1.3" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>MISSION CONTROL</h1>
      <p class="tag">Seth&rsquo;s fleet &middot; live telemetry</p>
    </div>
  </div>
  <div class="hdr-right">
    <div id="clock">--:--:--</div>
    <div id="updated">connecting&hellip;</div>
  </div>
</header>

<main class="grid" id="fleet"></main>

<button id="broadcast">&#128226; Broadcast alert to all devices</button>
<div id="bmsg"></div>

<footer><span id="src">&hellip;</span> &middot; collector <span id="collector">&hellip;</span></footer>
</div>

<script>
const LIVE = location.hostname !== 'kellner-dot.github.io'; // tailnet server = full actions
let STATUS_URL = LIVE ? '/api/status' : 'status.json';

/* ---------- icons (inline SVG, no external deps) ---------- */
const ICONS = {
  server: `<svg viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.6"/><rect x="3" y="13" width="18" height="7" rx="1.6"/><circle cx="7" cy="7.5" r="1" fill="#7dd3fc" stroke="none"/><circle cx="7" cy="16.5" r="1" fill="#7dd3fc" stroke="none"/><path d="M10.5 7.5h7M10.5 16.5h7"/></svg>`,
  laptop: `<svg viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="10" rx="1.6"/><path d="M2.5 18.5h19l-1.6-2.6H4.1z"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="1.7" stroke-linecap="round"><rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.8 18.4h2.4"/></svg>`,
  tv: `<svg viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="5" width="18.4" height="12.4" rx="2"/><path d="M9 20.5h6"/></svg>`,
  github: `<svg viewBox="0 0 24 24" fill="#e6edf3"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`,
  applemusic: `<svg viewBox="0 0 24 24" fill="#fa2d48"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>`,
  vinyl: `<svg viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" opacity=".45"/><circle cx="12" cy="12" r="1.6" fill="#f9a8d4" stroke="none"/></svg>`,
  film: `<svg viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.5h19M2.5 14.5h19M7 5v14M17 5v14"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 18.5a4.5 4.5 0 0 0 .9-8.9A6 6 0 0 0 6.7 8.8 4.8 4.8 0 0 0 7 18.5h10.5z"/></svg>`,
  magnet: `<svg viewBox="0 0 24 24" fill="none" stroke="#f0abfc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4v7a3 3 0 0 0 6 0V4h4v7a7 7 0 0 1-14 0V4z"/><path d="M5 8.5h4M15 8.5h4"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" fill="none" stroke="#86efac" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3v6c0 4.5-3.2 7.6-7.5 9-4.3-1.4-7.5-4.5-7.5-9v-6l7.5-3z"/><path d="M9 11.5l2.2 2.2 4.3-4.2"/></svg>`,
  calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/></svg>`,
  bolt: `<svg viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12l1-8z"/></svg>`
};

/* ---------- helpers (data contract preserved) ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pill(on, txt){
  return `<span class="pill ${on===true?'on':on===false?'off':'na'}">${txt||(on?'online':'offline')}</span>`;
}
function row(k,v){ return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }
function fmtUptime(s){
  if(s==null) return '—';
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d>0?`${d}d ${h}h`:(h>0?`${h}h ${m}m`:`${m}m`);
}
function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  return s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;
}
function fmtBytes(b){
  if(b==null||isNaN(b)) return '—';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return `${b>=100?Math.round(b):b.toFixed(1)} ${u[i]}`;
}
function meter(pct, cls){
  const p=Math.max(0,Math.min(100,pct));
  return `<div class="meter ${cls||''}"><i style="width:${p}%"></i></div>`;
}
function uptimeMeter(s){
  if(s==null) return '';
  const pct=Math.min(100,(s/86400)*100);
  return meter(pct, pct>66?'':(pct>33?'warn':'bad'));
}

/* ---------- render ---------- */
function sec(title, html){ return `<div class="seclabel"><span>${title}</span></div><div class="grid">${html}</div>`; }

function render(j){
  const upd=document.getElementById('updated');
  const s=Math.floor((Date.now()-new Date(j.generated_iso).getTime())/1000);
  upd.innerHTML = s<90 ? `<span class="fresh">● live</span> · ${ago(j.generated_iso)}` : `updated ${ago(j.generated_iso)}`;
  document.getElementById('src').innerHTML = LIVE ? '<span class="live-tag">● tailnet</span> · live actions on' : 'public snapshot · read-only';
  document.getElementById('collector').textContent = (j.collector||'—').replace(/\s*\(.*\)/,'');

  const byId={}; (j.devices||[]).forEach(d=>byId[d.id]=d);
  const pc = byId['seths-pc'];

  let fleet='';
  if(pc) fleet+=pcCard(pc);
  if(byId['seths-macbook-air']) fleet+=macCard(byId['seths-macbook-air']);
  if(byId['iphone-xs-max']) fleet+=phoneCard(byId['iphone-xs-max']);
  if(byId['motorola-razr-2023']) fleet+=phoneCard(byId['motorola-razr-2023']);
  // Fire TV Stick gets its own card (data lives under the PC device)
  fleet+=fireTvCard(pc && pc.firetv);

  let media='';
  media+=embyCard(j.emby_library, pc && pc.emby_sessions);
  media+=teraboxCard(j.terabox, pc && pc.terabox_uploaders);
  media+=biglybtCard(j.biglybt);
  media+=appleMusicCard();
  media+=artistCard();

  let ops='';
  ops+=githubCard(j.github);
  ops+=kaviguardCard(j.kaviguard);
  ops+=actionsCard();
  ops+=calendarCard();

  document.getElementById('fleet').innerHTML =
    sec('Fleet', fleet) + sec('Media', media) + sec('Ops', ops);

  const b=document.getElementById('broadcast');
  if(!LIVE){ b.disabled=true; b.innerHTML='&#128226; Broadcast <span style="opacity:.7">(tailnet only)</span>'; }
}

/* ---------- quick actions (tailnet-only, contract: confirm + POST) ---------- */
async function qact(endpoint, label){
  if(!LIVE) return;
  if(!confirm(label+' — are you sure?')) return;
  const m=document.getElementById('qmsg');
  m.textContent='sending…';
  try{
    const r=await fetch(endpoint,{method:'POST'});
    const j=await r.json();
    m.textContent=j.ok?('✅ '+(j.detail||'done')):('❌ '+(j.error||'failed'));
  }catch(e){ m.textContent='❌ relay unreachable — endpoint may not exist yet'; }
  setTimeout(load, 4000);
}

/* ---------- data load (contract preserved) ---------- */
async function load(){
  try{
    const r = await fetch(STATUS_URL, {cache:'no-store'});
    const j = await r.json();
    render(j);
  }catch(e){
    document.getElementById('fleet').innerHTML =
      `<div class="card"><div class="err-card"><div class="big">🛰️</div>
       <h2 style="margin:0 0 6px">collector offline</h2>
       <div class="sub">status.json unreachable — check the 5-min cron</div></div></div>`;
  }
}

/* ---------- broadcast (contract preserved) ---------- */
document.getElementById('broadcast').addEventListener('click', async ()=>{
  const m=document.getElementById('bmsg'), b=document.getElementById('broadcast');
  const msg=prompt('Alert message for all devices:','Mission Control ping');
  if(msg==null) return;
  b.disabled=true; m.textContent='sending…';
  try{
    const r=await fetch('/api/broadcast',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const j=await r.json();
    m.textContent=j.ok?('✅ '+j.detail):('❌ '+(j.error||'failed'));
  }catch(e){ m.textContent='❌ relay unreachable'; }
  b.disabled=false;
});

/* ---------- live clock ---------- */
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick,1000);

load();
setInterval(load, 60000);
</script>
