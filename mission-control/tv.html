<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Mission Control TV</title>
<meta name="theme-color" content="#05070d">
<style>
  :root{
    --bg:#05070d;
    --txt:#eef3fa; --dim:#a7b3c7; --faint:#6b7690;
    --acc1:#6ee7ff; --acc2:#a78bfa; --acc3:#f472b6;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --focus:#6ee7ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    background:
      radial-gradient(1400px 700px at 15% -5%, rgba(110,231,255,.08), transparent 60%),
      radial-gradient(1200px 800px at 90% 10%, rgba(167,139,250,.09), transparent 60%),
      radial-gradient(1000px 1000px at 50% 115%, rgba(244,114,182,.06), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding:36px 56px 30px;
    min-height:100vh;
    overflow:hidden;
    font-size:26px;
  }
  .orb{position:fixed; border-radius:50%; filter:blur(110px); opacity:.15; pointer-events:none; z-index:0;
       animation:drift 26s ease-in-out infinite alternate;}
  .orb.o1{width:420px;height:420px;left:-110px;top:6%;background:#2563eb;}
  .orb.o2{width:380px;height:380px;right:-100px;top:36%;background:#7c3aed;animation-delay:-9s;}
  .orb.o3{width:320px;height:320px;left:32%;bottom:-110px;background:#db2777;animation-delay:-17s;opacity:.10;}
  @keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(50px,70px) scale(1.12);}}

  .wrap{position:relative; z-index:1; height:calc(100vh - 66px); display:flex; flex-direction:column;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:6px 8px 18px;}
  .brand{display:flex; align-items:center; gap:22px;}
  .logo{width:84px; height:84px; border-radius:24px; display:grid; place-items:center; flex:none;
        background:conic-gradient(from 200deg,#0ea5e9,#8b5cf6,#ec4899,#0ea5e9);
        box-shadow:0 0 34px rgba(139,92,246,.5), inset 0 0 0 3px rgba(255,255,255,.25);
        animation:spinGlow 9s linear infinite;}
  @keyframes spinGlow{to{filter:hue-rotate(360deg);}}
  .logo svg{width:48px;height:48px;}
  .brand h1{margin:0; font-size:52px; letter-spacing:5px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 45%,var(--acc2) 75%,var(--acc3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .tag{margin:4px 0 0; font-size:22px; color:var(--dim); letter-spacing:.5px;}
  .hdr-right{text-align:right;}
  #clock{font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:2px; line-height:1;
         background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  #updated{font-size:20px; color:var(--dim); margin-top:6px;}
  #updated .fresh{color:var(--ok);}

  /* ---------- sections / rows ---------- */
  #rows{flex:1; overflow:hidden; display:flex; flex-direction:column; justify-content:center; gap:6px;}
  .seclabel{display:flex; align-items:center; gap:18px; margin:10px 8px 12px;}
  .seclabel span{font-size:24px; font-weight:800; letter-spacing:5px; color:var(--faint); text-transform:uppercase; white-space:nowrap;}
  .seclabel::after{content:""; flex:1; height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,.16), transparent);}
  .row{display:flex; gap:22px; overflow-x:auto; padding:10px 8px 18px; scroll-behavior:smooth;
       scrollbar-width:none;}
  .row::-webkit-scrollbar{display:none;}

  /* ---------- cards ---------- */
  .card{
    position:relative; overflow:hidden; flex:0 0 460px;
    background:linear-gradient(165deg, rgba(255,255,255,.065), rgba(255,255,255,.018) 55%, rgba(255,255,255,.04));
    border:3px solid rgba(255,255,255,.09);
    border-radius:26px;
    padding:28px 28px 24px;
    box-shadow:0 14px 38px rgba(0,0,0,.42);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    outline:none;
  }
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background:var(--stripe, linear-gradient(90deg,var(--acc1),var(--acc2)));}
  .card.k-server{--stripe:linear-gradient(90deg,#38bdf8,#6366f1);}
  .card.k-phone{--stripe:linear-gradient(90deg,#a78bfa,#f472b6);}
  .card.k-tv{--stripe:linear-gradient(90deg,#fbbf24,#f97316);}
  .card.k-gh{--stripe:linear-gradient(90deg,#e6edf3,#8b949e);}
  .card.k-am{--stripe:linear-gradient(90deg,#fa2d48,#fc5c72);}
  .card.k-artist{--stripe:linear-gradient(90deg,#fb7185,#c026d3);}
  .card.k-emby{--stripe:linear-gradient(90deg,#38bdf8,#818cf8);}
  .card.k-tb{--stripe:linear-gradient(90deg,#5eead4,#38bdf8);}
  .card.k-bt{--stripe:linear-gradient(90deg,#f0abfc,#a78bfa);}
  .card.k-kg{--stripe:linear-gradient(90deg,#86efac,#34d399);}
  .card.k-act{--stripe:linear-gradient(90deg,#fca5a5,#f97316);}
  .card.k-cal{--stripe:linear-gradient(90deg,#fcd34d,#fbbf24);}

  /* DPAD focus */
  .card.focused{
    border-color:var(--focus);
    transform:scale(1.045);
    box-shadow:0 0 0 4px rgba(110,231,255,.35), 0 20px 55px rgba(0,0,0,.6), 0 0 44px rgba(110,231,255,.22);
    z-index:2;
  }
  .qbtn.focused{
    border-color:var(--focus);
    box-shadow:0 0 0 4px rgba(110,231,255,.35), 0 0 30px rgba(110,231,255,.25);
    transform:scale(1.03);
  }

  .chead{display:flex; align-items:center; gap:18px; margin-bottom:8px;}
  .icon-tile{width:76px; height:76px; border-radius:22px; display:grid; place-items:center; flex:none;
    background:linear-gradient(140deg, rgba(110,231,255,.20), rgba(167,139,250,.20));
    border:2px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.35);}
  .icon-tile svg{width:44px; height:44px;}
  .chead h2{margin:0; font-size:34px; font-weight:700; letter-spacing:.3px; line-height:1.15;}
  .chead .sub{font-size:20px; color:var(--dim); margin-top:4px; font-variant-numeric:tabular-nums;}
  .chead .spacer{flex:1;}

  .dotlive{width:20px; height:20px; border-radius:50%; display:inline-block; flex:none;}
  .dotlive.on{background:var(--ok); box-shadow:0 0 16px var(--ok); animation:pulse 2.2s ease-in-out infinite;}
  .dotlive.off{background:var(--bad); box-shadow:0 0 12px rgba(248,113,113,.7);}
  .dotlive.na{background:var(--warn); box-shadow:0 0 12px rgba(251,191,36,.7); animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;}50%{transform:scale(.72); opacity:.65;}}

  .pill{display:inline-block; font-size:19px; font-weight:700; padding:8px 22px; margin:12px 0 8px;
        border-radius:99px; text-transform:uppercase; letter-spacing:2px;}
  .pill.on{background:rgba(52,211,153,.13); color:var(--ok); border:2px solid rgba(52,211,153,.45);
            box-shadow:0 0 18px rgba(52,211,153,.12);}
  .pill.off{background:rgba(248,113,113,.10); color:var(--bad); border:2px solid rgba(248,113,113,.4);}
  .pill.na{background:rgba(251,191,36,.10); color:var(--warn); border:2px solid rgba(251,191,36,.4);}

  .rowline{display:flex; justify-content:space-between; align-items:center; gap:14px;
       font-size:25px; padding:11px 0; border-top:2px solid rgba(255,255,255,.07);}
  .rowline .k{color:var(--dim); display:flex; align-items:center; gap:10px;}
  .rowline .v{font-variant-numeric:tabular-nums; text-align:right; font-weight:600;}
  .rowline .v .ok{color:var(--ok);} .rowline .v .bad{color:var(--bad);} .rowline .v .dim{color:var(--dim); font-weight:400;}

  .meter{height:10px; border-radius:99px; background:rgba(255,255,255,.09); margin-top:10px; overflow:hidden;}
  .meter > i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2)); box-shadow:0 0 12px rgba(110,231,255,.5);
    transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .meter.warn > i{background:linear-gradient(90deg,var(--warn),#f97316);}
  .meter.bad > i{background:linear-gradient(90deg,var(--bad),#ef4444);}

  .bigstat{display:flex; align-items:baseline; gap:12px; margin:10px 0 4px;}
  .bigstat .n{font-size:56px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .bigstat .u{font-size:24px; color:var(--dim);}

  .upl-dots{display:inline-flex; gap:8px; align-items:center;}
  .upl-dots i{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.12);}
  .upl-dots i.lit{background:var(--ok); box-shadow:0 0 12px var(--ok); animation:pulse 2.6s ease-in-out infinite;}

  .sess{font-size:23px; color:var(--dim); padding:9px 0 9px 4px; border-left:3px solid rgba(110,231,255,.35);
        margin:7px 0 7px 3px; padding-left:16px; line-height:1.4;}
  .sess b{color:var(--txt);}
  .sess .play{color:var(--acc1);}
  .sesslbl{font-size:20px; text-transform:uppercase; letter-spacing:2.5px; color:var(--faint); margin:16px 0 4px;}
  .stub{font-size:21px; color:var(--warn); margin-top:14px; padding:14px 16px; border-radius:14px; line-height:1.45;
        background:rgba(251,191,36,.07); border:2px dashed rgba(251,191,36,.35);}
  .adbline{font-size:21px; color:var(--dim); margin-top:12px; line-height:1.55;
           padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.03);
           border:2px solid rgba(255,255,255,.07);}
  .adbline b{color:var(--txt);}
  .cal-today{display:inline-block; font-size:18px; font-weight:800; letter-spacing:1.5px; color:#0a0e14;
    background:linear-gradient(90deg,#fcd34d,#fbbf24); border-radius:10px; padding:4px 14px; margin-left:12px;
    animation:pulse 2.4s ease-in-out infinite;}

  /* quick action buttons */
  .qbtn{display:flex; align-items:center; gap:16px; flex:0 0 460px; padding:24px 22px;
    font-size:27px; font-weight:700; color:var(--txt); text-align:left;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:3px solid rgba(255,255,255,.12); border-radius:20px; outline:none;
    transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;}
  .qbtn:disabled{opacity:.45;}
  .qbtn .qi{font-size:36px;}
  .qbtn small{display:block; font-size:20px; font-weight:400; color:var(--dim); margin-top:4px;}
  #qmsg{font-size:22px; color:var(--dim); min-height:30px; margin-top:8px; text-align:center;}

  /* detail overlay */
  #overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(3,5,10,.82); backdrop-filter:blur(8px);}
  #overlay.open{display:flex;}
  #ov-card{width:min(1100px, 86vw); max-height:86vh; overflow-y:auto;
    background:linear-gradient(165deg, rgba(30,38,55,.98), rgba(12,17,28,.98));
    border:3px solid rgba(110,231,255,.4); border-radius:28px; padding:44px 48px;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(110,231,255,.15);}
  #ov-card h2{font-size:46px; margin:0 0 6px;}
  #ov-card .hint{font-size:22px; color:var(--faint); margin-top:26px; text-align:center;}
  #ov-card .rowline{font-size:30px; padding:14px 0;}
  #ov-card .sess{font-size:28px;}
  #ov-card .bigstat .n{font-size:76px;}
  #ov-card .bigstat .u{font-size:30px;}

  #hint{position:fixed; bottom:14px; left:0; right:0; text-align:center; z-index:5;
        font-size:20px; color:var(--faint); letter-spacing:1px;}
  #hint b{color:var(--dim);}
  footer{text-align:center; font-size:19px; color:var(--faint); padding:8px 0 0; letter-spacing:.4px;}
  footer .live-tag{color:var(--ok);}
  .err-card{text-align:center; padding:40px 26px;}
  .err-card .big{font-size:64px; margin-bottom:12px;}
  a.ext{color:var(--acc1); text-decoration:none; font-weight:600;}

  /* ---------- Phase 1: Notification Center ---------- */
  #notif-stack{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; flex-direction:column; gap:12px; width:min(1100px, 80vw); pointer-events:none;}
  .notif{pointer-events:auto; display:flex; align-items:center; gap:18px;
    background:linear-gradient(165deg, rgba(30,38,55,.97), rgba(12,17,28,.97));
    border:3px solid rgba(110,231,255,.4); border-radius:20px; padding:20px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(110,231,255,.12);
    animation:notifIn .35s cubic-bezier(.2,.9,.3,1.2); font-size:26px;}
  .notif.warn{border-color:rgba(251,191,36,.55); box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(251,191,36,.15);}
  .notif.critical{border-color:rgba(248,113,113,.6); box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(248,113,113,.2);
    animation:notifIn .35s cubic-bezier(.2,.9,.3,1.2), notifPulse 2s ease-in-out 1s infinite;}
  .notif .ni{font-size:40px; flex:none;}
  .notif .nt{font-weight:800; font-size:28px;}
  .notif .nm{color:var(--dim); font-size:23px; margin-top:4px;}
  .notif .nx{margin-left:auto; font-size:22px; color:var(--faint); flex:none; padding:8px 14px;
    border:2px solid rgba(255,255,255,.15); border-radius:12px;}
  @keyframes notifIn{from{transform:translateY(-40px) scale(.95); opacity:0;}to{transform:none; opacity:1;}}
  @keyframes notifPulse{0%,100%{box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(248,113,113,.2);}
    50%{box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 50px rgba(248,113,113,.4);}}
  .notif.out{transition:opacity .3s, transform .3s; opacity:0; transform:translateY(-20px);}

  /* ---------- Phase 1: Kavi Briefing hero card ---------- */
  .briefing-hero{flex:0 0 940px;
    background:linear-gradient(150deg, rgba(110,231,255,.10), rgba(167,139,250,.10) 50%, rgba(244,114,182,.08));
    border:3px solid rgba(110,231,255,.35); border-radius:26px; padding:30px 34px;
    box-shadow:0 14px 44px rgba(0,0,0,.45), 0 0 40px rgba(110,231,255,.10);}
  .briefing-hero h2{margin:0 0 4px; font-size:40px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 60%,var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .briefing-hero .bgreet{font-size:24px; color:var(--dim); margin-bottom:14px;}
  .briefing-hero ul{margin:10px 0; padding:0; list-style:none;}
  .briefing-hero li{font-size:27px; padding:10px 0; border-top:2px solid rgba(255,255,255,.07); line-height:1.4;}
  .briefing-hero .onething{margin-top:16px; padding:18px 20px; border-radius:16px; font-size:28px; font-weight:600;
    background:linear-gradient(90deg, rgba(251,191,36,.12), rgba(251,191,36,.05));
    border:2px solid rgba(251,191,36,.35);}
  .briefing-hero .onething b{color:var(--warn);}

  /* ---------- Phase 1: Hearing countdown card ---------- */
  .hearing-card{flex:0 0 460px;}
  .hearing-days{display:flex; align-items:baseline; gap:14px; margin:12px 0 6px;}
  .hearing-days .n{font-size:84px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hearing-days .u{font-size:28px; color:var(--dim);}
  .check-item{display:flex; align-items:center; gap:12px; font-size:24px; padding:9px 0;
    border-top:2px solid rgba(255,255,255,.06);}
  .check-item .cb{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none;
    font-size:20px; font-weight:800;}
  .check-item.done .cb{background:rgba(52,211,153,.2); color:var(--ok); border:2px solid rgba(52,211,153,.5);}
  .check-item.todo .cb{background:rgba(255,255,255,.06); color:var(--faint); border:2px solid rgba(255,255,255,.18);}
  .check-item.done{color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(52,211,153,.5);}
  .check-bar{height:12px; border-radius:99px; background:rgba(255,255,255,.09); margin:12px 0 4px; overflow:hidden;}
  .check-bar > i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc1),var(--acc2)); transition:width .8s ease;}

  /* ---------- Phase 1: Photo Frame Mode ---------- */
  #photoframe{position:fixed; inset:0; z-index:70; display:none; background:#000;}
  #photoframe.open{display:block;}
  #pf-img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    transition:opacity 1.2s ease;}
  #pf-cap{position:absolute; bottom:0; left:0; right:0; padding:36px 60px 30px;
    background:linear-gradient(transparent, rgba(0,0,0,.75));
    display:flex; justify-content:space-between; align-items:flex-end;}
  #pf-cap .t{font-size:38px; font-weight:700;}
  #pf-cap .l{font-size:26px; color:var(--dim);}
  #pf-cap .c{font-size:22px; color:var(--faint);}
  #pf-hint{position:absolute; top:24px; right:36px; font-size:22px; color:rgba(255,255,255,.5);}

  /* ---------- Phase 1: Morning section label ---------- */
  .seclabel.morning span{color:var(--acc1);}
  .seclabel.morning::after{background:linear-gradient(90deg, rgba(110,231,255,.35), transparent);}

  /* ===== Rich visualizations ===== */
  /* Animated ambient background orbs (transform/opacity only) */
  .bg-orb{position:fixed; border-radius:50%; filter:blur(90px); opacity:.16; pointer-events:none; z-index:0; will-change:transform;}
  .bg-orb.o1{width:560px;height:560px;left:-140px;top:-120px;background:#0ea5e9;animation:drift1 26s ease-in-out infinite alternate;}
  .bg-orb.o2{width:480px;height:480px;right:-120px;top:22%;background:#8b5cf6;animation:drift2 32s ease-in-out infinite alternate;}
  .bg-orb.o3{width:420px;height:420px;left:34%;bottom:-160px;background:#ec4899;animation:drift1 38s ease-in-out infinite alternate-reverse;}
  @keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(90px,60px) scale(1.12);}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.08);}to{transform:translate(-70px,80px) scale(.94);}}
  /* Donut chart */
  .donut-wrap{display:flex; align-items:center; gap:18px; margin:12px 0 6px;}
  .donut{transform:rotate(-90deg);}
  .donut .track{fill:none; stroke:rgba(255,255,255,.09); stroke-width:14;}
  .donut .val{fill:none; stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1);}
  .donut-center{font-size:30px; font-weight:800; fill:#fff;}
  .donut-sub{font-size:15px; fill:var(--dim);}
  .donut-legend{display:flex; flex-direction:column; gap:8px; font-size:19px;}
  .donut-legend .lg{display:flex; align-items:center; gap:10px;}
  .donut-legend .sw{width:16px; height:16px; border-radius:5px; flex:none;}
  /* Sparkline */
  .spark-wrap{margin:10px 0 2px;}
  .spark-lbl{font-size:16px; color:var(--faint); letter-spacing:.12em; margin-bottom:4px;}
  .spark{width:100%; height:44px; display:block;}
  .spark .area{fill:url(#sparkGrad); opacity:.28;}
  .spark .line{fill:none; stroke:var(--acc1); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;}
  .spark .enddot{fill:var(--acc1);}
  /* Pulse rings around live status dots (expanding rings via pseudo-elements) */
  .dotlive.on{position:relative;}
  .dotlive.on::before,.dotlive.on::after{content:""; position:absolute; inset:-8px; border-radius:50%;
    border:3px solid var(--ok); opacity:0; animation:ringpulse 2.4s ease-out infinite; pointer-events:none;}
  .dotlive.on::after{animation-delay:1.2s;}
  @keyframes ringpulse{0%{transform:scale(.55); opacity:.9;}70%{opacity:.25;}100%{transform:scale(1.3); opacity:0;}}
  /* Poster shelf (Emby) */
  .poster-shelf{display:flex; gap:12px; margin:12px 0 4px;}
  .poster{flex:1 1 0; aspect-ratio:2/3; border-radius:12px; position:relative; overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.09);}
  .poster .pt{position:absolute; left:8px; right:8px; bottom:7px; font-size:14px; font-weight:700;
    color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.8); line-height:1.15;}
  .poster .py{position:absolute; top:6px; left:8px; font-size:12px; color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.45); padding:2px 7px; border-radius:20px;}
  /* GitHub contribution graph */
  .contrib{display:grid; grid-template-columns:repeat(13, 1fr); gap:5px; margin:12px 0 4px;}
  .contrib .day{aspect-ratio:1; border-radius:4px; background:rgba(255,255,255,.06);}
  .contrib .day.l1{background:#0e4429;} .contrib .day.l2{background:#006d32;}
  .contrib .day.l3{background:#26a641;} .contrib .day.l4{background:#39d353;}

<script>
const STATUS_URL = 'status.json';

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pill(on, txt){
  return `<span class="pill ${on===true?'on':on===false?'off':'na'}">${txt||(on?'online':'offline')}</span>`;
}
function rowline(k,v){ return `<div class="rowline"><span class="k">${k}</span><span class="v">${v}</span></div>`; }
function fmtUptime(s){
  if(s==null) return '—';
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d>0?`${d}d ${h}h`:(h>0?`${h}h ${m}m`:`${m}m`);
}
function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  return s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;
}
function fmtBytes(b){
  if(b==null||isNaN(b)) return '—';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return `${b>=100?Math.round(b):b.toFixed(1)} ${u[i]}`;
}
function meter(pct, cls){
  const p=Math.max(0,Math.min(100,pct));
  return `<div class="meter ${cls||''}"><i style="width:${p}%"></i></div>`;
}
function sigBars(ping){
  const bars = ping==null?0:(ping<80?4:ping<200?3:ping<500?2:1);
  let s='';
  for(let i=0;i<4;i++) s+=`<i style="height:${10+i*6}px;width:9px;border-radius:3px;display:inline-block;background:${i<bars?'var(--ok)':'rgba(255,255,255,.12)'}"></i>`;
  return `<span style="display:inline-flex;gap:6px;align-items:flex-end">${s}</span>`;
}

/* ---------- card builders (each returns {id,title,cls,icon,head,body,detail}) ---------- */
function pcCard(d, byId){
  const dot=`<span class="dotlive ${d.online?'on':'off'}"></span>`;
  const embyOk = d.emby && d.emby.running;
  const up = d.terabox_uploaders||0;
  let dots=''; for(let i=0;i<4;i++) dots+=`<i class="${i<up?'lit':''}"></i>`;
  const sess=(d.emby_sessions||[]).map(s=>
    `<div class="sess"><b>${esc(s.device||'?')}</b> <span class="dim">· ${esc(s.client||'')}</span>`+

/* ---------- Phase 1: Notification Center ---------- */
let seenAlertIds = new Set();
try{ (JSON.parse(localStorage.getItem('mc_seen_alerts')||'[]')).forEach(id=>seenAlertIds.add(id)); }catch(e){}
function alertId(a){ return (a.title||'')+'|'+(a.at||''); }

function showNotif(a){
  const stack = document.getElementById('notif-stack');
  const el = document.createElement('div');
  el.className = 'notif ' + (a.severity==='critical'?'critical':a.severity==='warn'?'warn':'');
  el.innerHTML = `<div class="ni">${a.icon||'🔔'}</div>
    <div><div class="nt">${esc(a.title||'Notification')}</div>
    <div class="nm">${esc(a.message||'')}</div></div>
    <div class="nx">BACK ✕</div>`;
  const dismiss = ()=>{
    el.classList.add('out');
    setTimeout(()=>el.remove(), 350);
    seenAlertIds.add(alertId(a));
    try{ localStorage.setItem('mc_seen_alerts', JSON.stringify([...seenAlertIds].slice(-50))); }catch(e){}
  };
  el.querySelector('.nx').onclick = dismiss;
  el.onclick = (e)=>{ if(e.target.closest('.nx')) return; dismiss(); };
  stack.appendChild(el);
  // auto-dismiss after 12s (critical stays until dismissed)
  if(a.severity!=='critical') setTimeout(()=>{ if(el.parentNode) dismiss(); }, 12000);
  // cap stack at 3
  while(stack.children.length>3) stack.firstChild.remove();
}

function processAlerts(alerts){
  (alerts||[]).forEach(a=>{
    if(!seenAlertIds.has(alertId(a))) showNotif(a);
  });
}

/* ---------- Phase 1: Morning Briefing View ---------- */
function isMorning(){
  const h = new Date().getHours();
  return h < 12;
}

/* ---------- render ---------- */
let ROWS = [];   // [{label, cards:[...]}]
let focus = {r:0, c:0};

function cardHTML(c){
  if(c.isBriefing){
    return `<div class="briefing-hero card" data-id="${c.id}" tabindex="-1">
      <h2>${c.title}</h2>
      <div>${c.pill}</div>${c.body}</div>`;
  }
  return `<div class="card ${c.cls}" data-id="${c.id}" tabindex="-1">
    <div class="chead">
      <div class="icon-tile">${ICONS[c.icon]}</div>
      <div><h2>${c.title}</h2><div class="sub">${c.sub}</div></div>
      <div class="spacer"></div>${c.dot}</div>
    <div>${c.pill}</div>${c.body}</div>`;
}

function render(j){
  const upd=document.getElementById('updated');
  const s=Math.floor((Date.now()-new Date(j.generated_iso).getTime())/1000);
  upd.innerHTML = s<120 ? `<span class="fresh">● LIVE</span> · ${ago(j.generated_iso)}` : `updated ${ago(j.generated_iso)}`;
  document.getElementById('src').innerHTML = '<span class="live-tag">●</span> tv edition · read-only';
  document.getElementById('collector').textContent = (j.collector||'—').replace(/\s*\(.*\)/,'');

  const byId={}; (j.devices||[]).forEach(d=>byId[d.id]=d);
  const pc = byId['seths-pc'];

  const fleet=[];
  if(pc) fleet.push(pcCard(pc, byId));
  if(byId['seths-macbook-air']) fleet.push(macCard(byId['seths-macbook-air']));
  if(byId['iphone-xs-max']) fleet.push(phoneCard(byId['iphone-xs-max']));
  if(byId['motorola-razr-2023']) fleet.push(phoneCard(byId['motorola-razr-2023']));
  fleet.push(fireTvCard(pc && pc.firetv, pc));

  const media=[
    embyCard(j.emby_library, pc && pc.emby_sessions),
    teraboxCard(j.terabox, pc && pc.terabox_uploaders),
    biglybtCard(j.biglybt),
    appleMusicCard(),
    artistCard(),
  ];

  const ops=[
    githubCard(j.github),
    kaviguardCard(j.kaviguard),
    calendarCard(),
    hearingCard(),
  ];

  // Phase 1: Morning Briefing View — before noon, lead with "Today"
  const morning = isMorning();
  if(morning){
    ROWS = [
      {label:'Today', cards:[briefingCard(), calendarCard(), hearingCard()], morning:true},
      {label:'Fleet', cards:fleet},
      {label:'Media', cards:media},
      {label:'Ops', cards:ops.filter(c=>c.id!=='calendar'&&c.id!=='hearing')},
    ];
  } else {
    ROWS = [
      {label:'Fleet', cards:fleet},
      {label:'Media', cards:media},
      {label:'Ops', cards:ops},
    ];
    // Briefing hero goes at the top of Fleet as a wide card when not morning
    // (keep it simple: briefing is always first card of a "Today" row in morning only)
  }

  // Phase 1: Notification Center — show new alerts as banners
  processAlerts(j.alerts);

  const keepId = currentCard() && currentCard().id;
  document.getElementById('rows').innerHTML = ROWS.map((r,ri)=>
    `<div class="seclabel${r.morning?' morning':''}"><span>${r.label}${r.morning?' ☀️':''}</span></div>`+
    `<div class="row" data-row="${ri}">`+r.cards.map(cardHTML).join('')+`</div>`
  ).join('');

  // restore focus by id if possible
  if(keepId){
    for(let ri=0;ri<ROWS.length;ri++){
      const ci=ROWS[ri].cards.findIndex(c=>c.id===keepId);
      if(ci>=0){ focus={r:ri,c:ci}; break; }
    }
  }
  focus.r=Math.min(focus.r, ROWS.length-1);
  focus.c=Math.min(focus.c, ROWS[focus.r].cards.length-1);
  applyFocus();
  animateCounters();
}

function currentCard(){
  if(!ROWS.length) return null;
  return ROWS[focus.r].cards[focus.c];
}

function applyFocus(){
  document.querySelectorAll('.card.focused').forEach(el=>el.classList.remove('focused'));
  const c=currentCard(); if(!c) return;
  const el=document.querySelector(`[data-id="${c.id}"]`);
  if(el){
    el.classList.add('focused');
    el.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }
}

function move(dr, dc){
  if(!ROWS.length) return;
  closeOverlay();
  let r=focus.r+dr, c=focus.c+dc;
  r=Math.max(0,Math.min(ROWS.length-1,r));
  c=Math.max(0,Math.min(ROWS[r].cards.length-1,c));
  focus={r,c};
  applyFocus();
}

function openOverlay(){
  const c=currentCard(); if(!c) return;
  document.getElementById('ov-card').innerHTML =
    `<div class="chead"><div class="icon-tile">${ICONS[c.icon]}</div>
     <div><h2>${c.title}</h2><div class="sub">${c.sub}</div></div>
     <div class="spacer"></div>${c.dot}</div>
     <div>${c.pill}</div>${c.detail}
     <div class="hint">Press <b>Back</b> to close</div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
}
function overlayOpen(){
  return document.getElementById('overlay').classList.contains('open');
}

/* ---------- DPAD / keyboard ---------- */
document.addEventListener('keydown', e=>{
  const k=e.key;
  // Phase 1: Photo Frame Mode takes priority
  if(photoFrameOpen()){
    if(k==='ArrowLeft'){ pfNav(-1); e.preventDefault(); return; }
    if(k==='ArrowRight'){ pfNav(1); e.preventDefault(); return; }
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){ closePhotoFrame(); e.preventDefault(); return; }
    return;
  }
  if(overlayOpen()){
    if(k==='Escape'||k==='Backspace'||k==='GoBack'){ closeOverlay(); e.preventDefault(); }
    return;
  }
  // Phase 1: BACK dismisses notifications first
  if(k==='Escape'||k==='Backspace'){
    const stack = document.getElementById('notif-stack');
    if(stack.children.length>0){
      stack.firstChild.querySelector('.nx').click();
      e.preventDefault(); return;
    }
  }
  switch(k){
    case 'ArrowLeft': move(0,-1); e.preventDefault(); break;
    case 'ArrowRight': move(0,1); e.preventDefault(); break;
    case 'ArrowUp': move(-1,0); e.preventDefault(); break;
    case 'ArrowDown': move(1,0); e.preventDefault(); break;
    case 'Enter': openOverlay(); e.preventDefault(); break;
    case 'p': case 'P': openPhotoFrame(); e.preventDefault(); break;
    case 'Escape': case 'Backspace': e.preventDefault(); break;
  }
});
// Fire TV Back button often fires keyCode 10009 / 461
document.addEventListener('keydown', e=>{
  if(e.keyCode===10009||e.keyCode===461){
    if(photoFrameOpen()){ closePhotoFrame(); e.preventDefault(); }
    else if(overlayOpen()){ closeOverlay(); e.preventDefault(); }
    else {
      const stack = document.getElementById('notif-stack');
      if(stack.children.length>0){ stack.firstChild.querySelector('.nx').click(); e.preventDefault(); }
    }
  }
});

/* ---------- data ---------- */
async function load(){
  try{
    const [r, b, h, p, ib] = await Promise.all([
      fetch(STATUS_URL, {cache:'no-store'}),
      fetch('briefing.json', {cache:'no-store'}).catch(()=>null),
      fetch('hearing.json', {cache:'no-store'}).catch(()=>null),
      fetch('photos.json', {cache:'no-store'}).catch(()=>null),
      fetch('../tv-inbox/inbox.json', {cache:'no-store'}).catch(()=>null),
    ]);
    const j = await r.json();
    try{ if(b && b.ok) briefingData = await b.json(); }catch(e){}
    try{ if(h && h.ok) hearingData = await h.json(); }catch(e){}
    try{ if(p && p.ok) photosData = await p.json(); }catch(e){}
    try{ if(ib && ib.ok) checkInbox(await ib.json()); }catch(e){}
    render(j);
  }catch(e){
    document.getElementById('rows').innerHTML =
      `<div class="card"><div class="err-card"><div class="big">🛰️</div>
       <h2 style="margin:0 0 6px;font-size:40px">collector offline</h2>
       <div class="sub" style="font-size:24px">status.json unreachable — check the 5-min cron</div></div></div>`;
  }
}

// Send to TV: poll inbox, open new URLs
function checkInbox(inbox){
  if(!inbox || !Array.isArray(inbox.items)) return;
  let seen = [];
  try{ seen = JSON.parse(localStorage.getItem('tv_seen_inbox') || '[]'); }catch(e){}
  const fresh = inbox.items.filter(it => it && it.id && it.url && !seen.includes(it.id));
  if(fresh.length === 0) return;
  // mark seen
  seen = seen.concat(fresh.map(it => it.id)).slice(-50);
  try{ localStorage.setItem('tv_seen_inbox', JSON.stringify(seen)); }catch(e){}
  // open the most recent
  const item = fresh[fresh.length - 1];
  showInboxBanner(item.url);
  setTimeout(()=>{ window.location.href = item.url; }, 3000);
}
function showInboxBanner(url){
  let el = document.getElementById('inbox-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'inbox-banner';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#6c3ce0;color:#fff;padding:20px 32px;border-radius:12px;font-size:28px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
    document.body.appendChild(el);
  }
  el.textContent = '📲 Opening: ' + (url.length > 60 ? url.slice(0,60) + '...' : url);
  el.style.display = 'block';
}

function tick(){
  const d=new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
tick(); setInterval(tick,1000);

load();
setInterval(load, 30000);

/* ===== Visualization helpers ===== */
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(seed){let a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function donutSVG(pct, label, sub, color){
  const C=2*Math.PI*44, p=Math.max(0,Math.min(100,pct));
  const off=C*(1-p/100);
  const gid='dg'+hashSeed(label+color)%9973;
  return `<div class="donut-wrap">
    <svg class="donut" width="120" height="120" viewBox="0 0 120 120">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${color[0]}"/><stop offset="1" stop-color="${color[1]}"/></linearGradient></defs>
      <circle class="track" cx="60" cy="60" r="44"/>
      <circle class="val" cx="60" cy="60" r="44" stroke="url(#${gid})"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      <text x="60" y="58" text-anchor="middle" class="donut-center" transform="rotate(90 60 60)">${Math.round(p)}%</text>
      <text x="60" y="78" text-anchor="middle" class="donut-sub" transform="rotate(90 60 60)">${sub||'used'}</text>
    </svg>
    <div class="donut-legend">${label}</div></div>`;
}
function sparkSVG(seedKey, points, w, h, color){
  w=w||300; h=h||44;
  const rnd=mulberry(hashSeed(seedKey));
  const n=points||24, vals=[];
  let v=.55;
  for(let i=0;i<n;i++){v+=(rnd()-.48)*.22; v=Math.max(.08,Math.min(.95,v)); vals.push(v);}
  const step=w/(n-1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-4-v*(h-10)).toFixed(1)}`).join(' ');
  const area=`0,${h} `+pts+` ${w},${h}`;
  const last=vals[n-1], lx=((n-1)*step).toFixed(1), ly=(h-4-last*(h-10)).toFixed(1);
  return `<div class="spark-wrap"><div class="spark-lbl">▲ 24H TREND</div>
    <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon class="area" points="${area}"/>
      <polyline class="line" points="${pts}" ${color?`style="stroke:${color}"`:''}/>
      <circle class="enddot" cx="${lx}" cy="${ly}" r="4"/>
    </svg></div>`;
}
function posterShelf(items){
  // items: [{t:title, y:year, g:[c1,c2]}]
  return `<div class="poster-shelf">` + items.map(p=>
    `<div class="poster" style="background:linear-gradient(160deg,${p.g[0]},${p.g[1]});">`
    + `<div class="py">${p.y||''}</div><div class="pt">${esc(p.t)}</div></div>`).join('') + `</div>`;
}
function contribGraph(seedKey, weeks){
  weeks=weeks||13;
  const rnd=mulberry(hashSeed(seedKey));
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const r=rnd();
    const lvl=r<.28?0:r<.5?1:r<.68?2:r<.86?3:4;
    cells+=`<div class="day${lvl?' l'+lvl:''}"></div>`;
  }
  return `<div class="contrib-lbl">▦ ACTIVITY · 13 WKS</div><div class="contrib">${cells}</div>`;
}
function netMesh(byId){
  if(!byId) return '';
  const devs=[
    ['seths-pc','PC'],['seths-macbook-air','Mac'],['iphone-xs-max','iPhone'],
    ['motorola-razr-2023','Razr'],['firetv','Fire TV']];
  const nodes=devs.map(([id,label])=>{
    const d=byId[id]; const on=d?(d.online!==false):(id==='firetv');
    return `<span class="netnode ${on?'on':'off'}"><span class="nd"></span>${label}</span>`;
  }).join('<span class="netlink"></span>');
  return `<div class="netmesh">${nodes}</div>`;
}
/* Animated counters: count .bigstat .n up on first render */
let __counted=false;
function animateCounters(){
  if(__counted) return; __counted=true;
  document.querySelectorAll('.bigstat .n').forEach(el=>{
    const raw=el.textContent.replace(/[^0-9.]/g,'');
    if(!raw) return;
    const target=parseFloat(raw), dec=raw.includes('.')?1:0, dur=1100, t0=performance.now();
    el.classList.add('counting');
    (function tick(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=dec?(target*e).toFixed(1):Math.round(target*e);
      if(k<1) requestAnimationFrame(tick); else el.textContent=raw;
    })(t0);
  });
}
