<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Skyline Weather</title>
<meta name="theme-color" content="#04060c">
<style>
  :root{
    --bg:#04060c;
    --txt:#f2f6fc; --dim:#a9b4c8; --faint:#5f6b85;
    --acc1:#6ee7ff; --acc2:#a78bfa; --acc3:#f472b6;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --focus:#6ee7ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg); font-size:26px; overflow-x:hidden;
  }
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1400px 700px at 12% -5%, rgba(110,231,255,.07), transparent 60%),
      radial-gradient(1200px 800px at 92% 8%, rgba(167,139,250,.08), transparent 60%),
      radial-gradient(1000px 900px at 50% 110%, rgba(244,114,182,.05), transparent 60%);}
  .wrap{position:relative; z-index:1; padding-bottom:140px;}

  /* ============ top bar ============ */
  .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
    padding:16px 64px 14px;
    background:linear-gradient(180deg, rgba(4,6,12,.96) 0%, rgba(4,6,12,.82) 65%, transparent 100%);}
  .brand{display:flex; align-items:center; gap:20px;}
  .logo{width:64px; height:64px; border-radius:18px; display:grid; place-items:center; flex:none;
    background:conic-gradient(from 200deg,#0ea5e9,#8b5cf6,#ec4899,#0ea5e9);
    box-shadow:0 0 28px rgba(139,92,246,.45), inset 0 0 0 2px rgba(255,255,255,.25);}
  .logo svg{width:36px;height:36px;}
  .brand h1{margin:0; font-size:38px; letter-spacing:6px; font-weight:800;
    background:linear-gradient(92deg,#fff 10%,var(--acc1) 45%,var(--acc2) 75%,var(--acc3));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .sub{font-size:20px; color:var(--faint); letter-spacing:3px; font-weight:600;}
  .top-right{display:flex; align-items:center; gap:26px;}
  #updated{font-size:22px; color:var(--faint); letter-spacing:2px; font-weight:600;}
  #clock{font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:2px; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ============ alert banner ============ */
  #alerts{display:none; margin:6px 64px 0; border-radius:26px; padding:34px 48px;
    background:linear-gradient(120deg, rgba(160,20,30,.92), rgba(120,10,22,.92));
    border:2px solid var(--bad); box-shadow:0 20px 60px rgba(248,113,113,.25);}
  #alerts.show{display:block;}
  #alerts .a-kicker{font-size:24px; font-weight:800; letter-spacing:6px; color:#ffd7d7; margin-bottom:10px; text-transform:uppercase;}
  #alerts .a-title{font-size:44px; font-weight:800; margin-bottom:8px;}
  #alerts .a-desc{font-size:28px; color:#ffe6e6; line-height:1.45; max-height:none;}
  #alerts .a-meta{margin-top:14px; font-size:23px; color:#ffb3b3; letter-spacing:1px;}

  /* ============ hero ============ */
  .hero{position:relative; margin:6px 64px 0; border-radius:30px; overflow:hidden;
    min-height:480px; display:flex; align-items:center;
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px rgba(0,0,0,.55); background:#0a0f1c;}
  .hero-bg{position:absolute; inset:0;
    background:
      radial-gradient(900px 420px at 78% 20%, var(--hero-glow1, rgba(56,189,248,.20)), transparent 65%),
      radial-gradient(700px 380px at 15% 85%, var(--hero-glow2, rgba(139,92,246,.16)), transparent 65%),
      linear-gradient(115deg, #0c1322 0%, #0a0f1e 55%, #0d1226 100%);}
  .hero-bg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(4,6,12,.88) 0%, rgba(4,6,12,.45) 45%, transparent 75%);}
  .hero-art{position:absolute; right:90px; top:50%; transform:translateY(-50%); opacity:.95;
    width:320px; height:320px; display:grid; place-items:center;
    filter:drop-shadow(0 20px 60px rgba(0,0,0,.6));}
  .hero-art svg{width:260px; height:260px; animation:heroFloat 7s ease-in-out infinite;}
  @keyframes heroFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-16px) scale(1.03);}}
  .hero-content{position:relative; z-index:2; padding:52px 60px;}
  .hero-kicker{font-size:24px; font-weight:800; letter-spacing:6px; color:var(--acc1); margin-bottom:14px; text-transform:uppercase;}
  .hero-temp{font-size:150px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff 30%,#b9c7de); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero-temp .deg{font-size:70px; vertical-align:top;}
  .hero-cond{font-size:52px; font-weight:800; margin:10px 0 6px; letter-spacing:1px;}
  .hero-sub{font-size:32px; color:var(--dim); font-weight:600; margin-bottom:24px;}
  .hero-stats{display:flex; gap:0; margin:6px 0 6px; flex-wrap:wrap;}
  .hstat{padding:6px 34px 6px 0; margin-right:34px; border-right:2px solid rgba(255,255,255,.10);}
  .hstat:last-child{border-right:none;}
  .hstat .n{font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hstat .u{display:block; font-size:21px; color:var(--faint); letter-spacing:2px; text-transform:uppercase; margin-top:6px;}

  /* ============ rows ============ */
  .row-sec{margin-top:38px;}
  .row-label{display:flex; align-items:center; gap:16px; padding:0 64px; margin-bottom:6px;}
  .row-label span{font-size:30px; font-weight:800; letter-spacing:5px; color:#cdd6e6; text-transform:uppercase; white-space:nowrap;}
  .row-label .cnt{font-size:22px; color:var(--faint); letter-spacing:2px; font-weight:600;}
  .row-viewport{overflow:hidden; padding:16px 64px 34px;}
  .row-track{display:flex; gap:26px; transition:transform .34s cubic-bezier(.2,.8,.2,1); will-change:transform;}
  .poster{flex:0 0 300px; border-radius:22px; overflow:hidden; background:#0b101d;
    border:3px solid transparent; transition:transform .22s ease, border-color .22s ease;
    outline:none; cursor:default; padding:26px 20px; text-align:center;}
  .poster .t{font-size:28px; font-weight:800; letter-spacing:2px; color:var(--dim); text-transform:uppercase;}
  .poster svg{width:110px; height:110px; margin:14px auto; display:block;}
  .poster .temp{font-size:52px; font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9db4d0); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .poster .precip{margin-top:10px; font-size:26px; color:var(--acc1); font-weight:700;}
  .poster .precip.zero{color:var(--faint); font-weight:400;}
  .poster .lo{font-size:30px; color:var(--faint); font-weight:600; margin-top:6px;}
  .poster .lo b{color:var(--txt); font-weight:800;}
  .poster.focused{transform:scale(1.08); border-color:var(--focus); z-index:5;
    box-shadow:0 18px 60px rgba(110,231,255,.25); background:#0e1626;}
  .daycard{flex:0 0 240px;}

  .status{padding:40px 64px; font-size:30px; color:var(--faint);}

  /* ============ help footer ============ */
  .help{position:fixed; bottom:0; left:0; right:0; z-index:40; padding:14px 64px;
    background:linear-gradient(0deg, rgba(4,6,12,.94), rgba(4,6,12,.75));
    font-size:23px; color:var(--faint); display:flex; gap:36px; letter-spacing:1px;}
  .help b{color:var(--dim);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M17.5 18a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 7 18h10.5z"/></svg></div>
      <div>
        <h1>SKYLINE</h1>
        <div class="sub">NORTH BENNINGTON VT &middot; 05257</div>
      </div>
    </div>
    <div class="top-right">
      <div id="updated"></div>
      <div id="clock">--:--</div>
    </div>
  </div>

  <div id="alerts">
    <div class="a-kicker">&#9888; Weather Alert</div>
    <div class="a-title" id="a-title"></div>
    <div class="a-desc" id="a-desc"></div>
    <div class="a-meta" id="a-meta"></div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content">
      <div class="hero-kicker" id="hero-place">North Bennington, VT</div>
      <div class="hero-temp" id="hero-temp">&mdash;<span class="deg">&deg;F</span></div>
      <div class="hero-cond" id="hero-cond">Loading&hellip;</div>
      <div class="hero-sub" id="hero-sub"></div>
      <div class="hero-stats">
        <div class="hstat"><span class="n" id="s-wind">&mdash;</span><span class="u">Wind mph</span></div>
        <div class="hstat"><span class="n" id="s-hum">&mdash;</span><span class="u">Humidity</span></div>
        <div class="hstat"><span class="n" id="s-hi">&mdash;</span><span class="u">Today&rsquo;s high</span></div>
        <div class="hstat"><span class="n" id="s-lo">&mdash;</span><span class="u">Tonight&rsquo;s low</span></div>
      </div>
    </div>
    <div class="hero-art" id="hero-art"></div>
  </div>

  <div class="row-sec">
    <div class="row-label"><span>Next 12 Hours</span></div>
    <div class="row-viewport"><div class="row-track" id="hourly-track"></div></div>
  </div>

  <div class="row-sec">
    <div class="row-label"><span>7-Day Forecast</span></div>
    <div class="row-viewport"><div class="row-track" id="daily-track"></div></div>
  </div>
</div>

<div class="help">
  <span><b>Up / Down</b> move between rows</span>
  <span><b>Left / Right</b> browse cards</span>
  <span><b>Enter</b> alert details</span>
  <span><b>R</b> refresh</span>
</div>

<script>
(function(){
  "use strict";
  var LAT = 42.9323, LON = -73.2427;
  var OM_URL = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,precipitation_probability,weather_code" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    "&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=7";
  var NWS_URL = "https://api.weather.gov/alerts/active?point=" + LAT + "," + LON;

  /* ---------- clock ---------- */
  function tickClock(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12; if(h === 0) h = 12;
    document.getElementById("clock").textContent = h + ":" + (m < 10 ? "0"+m : m) + " " + ap;
  }
  tickClock(); setInterval(tickClock, 15000);

  /* ---------- weather code mapping + SVG icons ---------- */
  function codeInfo(code){
    code = Number(code);
    if(code === 0) return {label:"Clear Sky", icon:"sun", night:"moon"};
    if(code === 1) return {label:"Mainly Clear", icon:"sun", night:"moon"};
    if(code === 2) return {label:"Partly Cloudy", icon:"partly"};
    if(code === 3) return {label:"Overcast", icon:"cloud"};
    if(code === 45 || code === 48) return {label:"Fog", icon:"fog"};
    if(code >= 51 && code <= 57) return {label:"Drizzle", icon:"rain"};
    if(code >= 61 && code <= 67) return {label:"Rain", icon:"rain"};
    if(code >= 71 && code <= 77) return {label:"Snow", icon:"snow"};
    if(code >= 80 && code <= 82) return {label:"Rain Showers", icon:"rain"};
    if(code === 85 || code === 86) return {label:"Snow Showers", icon:"snow"};
    if(code === 95) return {label:"Thunderstorm", icon:"storm"};
    if(code === 96 || code === 99) return {label:"Storm w/ Hail", icon:"storm"};
    return {label:"--", icon:"cloud"};
  }
  function iconSVG(kind, size){
    var s = size || 110;
    var wrap = "width='" + s + "' height='" + s + "' viewBox='0 0 64 64' fill='none'";
    var cloud = "<path d='M20 44h24a8 8 0 0 0 1.6-15.8A13 13 0 0 0 20 25a10 10 0 0 0-2 19.8z' fill='rgba(180,200,230,.92)'/>";
    var sun = "<circle cx='32' cy='32' r='11' fill='#ffd166'/><g stroke='#ffd166' stroke-width='3' stroke-linecap='round'><path d='M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M49 15l-4 4M19 45l-4 4'/></g>";
    var moon = "<path d='M44 38A16 16 0 0 1 26 20a16 16 0 1 0 18 18z' fill='#e8eefc'/>";
    var rainD = "<g stroke='#6ee7ff' stroke-width='3.5' stroke-linecap='round'><path d='M24 48l-3 8M34 48l-3 8M44 48l-3 8'/></g>";
    var snowD = "<g fill='#e8f4ff'><circle cx='25' cy='52' r='2.6'/><circle cx='34' cy='53' r='2.6'/><circle cx='43' cy='52' r='2.6'/></g>";
    var bolt = "<path d='M34 38l-8 14h6l-2 10 10-16h-6l4-8z' fill='#ffd166'/>";
    var fogL = "<g stroke='rgba(180,200,230,.85)' stroke-width='3' stroke-linecap='round'><path d='M18 46h28M22 53h24'/></g>";
    var body = "";
    if(kind === "sun") body = sun;
    else if(kind === "moon") body = moon;
    else if(kind === "partly") body = sun + "<g transform='translate(8,10) scale(.72)'>" + cloud + "</g>";
    else if(kind === "cloud") body = cloud;
    else if(kind === "rain") body = cloud + rainD;
    else if(kind === "snow") body = cloud + snowD;
    else if(kind === "storm") body = cloud + bolt;
    else if(kind === "fog") body = cloud + fogL;
    return "<svg " + wrap + ">" + body + "</svg>";
  }
  function heroGlow(kind){
    switch(kind){
      case "sun":   return ["rgba(255,209,102,.28)", "rgba(255,140,60,.10)"];
      case "moon":  return ["rgba(150,170,230,.20)", "rgba(80,100,180,.10)"];
      case "partly":return ["rgba(255,209,102,.16)", "rgba(56,189,248,.16)"];
      case "rain":  return ["rgba(56,189,248,.22)", "rgba(30,80,160,.14)"];
      case "snow":  return ["rgba(180,220,255,.22)", "rgba(110,231,255,.10)"];
      case "storm": return ["rgba(167,139,250,.24)", "rgba(60,40,120,.14)"];
      case "fog":   return ["rgba(160,175,200,.20)", "rgba(90,100,130,.12)"];
      default:      return ["rgba(160,175,200,.16)", "rgba(100,120,160,.10)"];
    }
  }

  /* ---------- focus model ---------- */
  var sections = [
    {track: "hourly-track", items: []},
    {track: "daily-track", items: []}
  ];
  var fRow = 0, fIdx = 0;
  function scrollToFocused(){
    var sec = sections[fRow];
    var cards = document.querySelectorAll("#" + sec.track + " .poster");
    for(var j = 0; j < cards.length; j++) cards[j].classList.remove("focused");
    var c = cards[fIdx];
    if(c){
      c.classList.add("focused");
      var vp = c.parentElement.parentElement;
      var x = c.offsetLeft - vp.clientWidth / 2 + c.offsetWidth / 2;
      sec.trackEl.style.transform = "translateX(" + (-Math.max(0, x)) + "px)";
    }
  }
  function move(dr, dc){
    var sec = sections[fRow];
    var n = sec.items.length;
    if(n === 0) return;
    if(dc !== 0){
      fIdx += dc;
      if(fIdx < 0) fIdx = 0;
      if(fIdx >= n) fIdx = n - 1;
    } else if(dr !== 0){
      var nr = fRow + dr;
      if(nr < 0 || nr > sections.length - 1) return;
      fRow = nr;
      var nn = sections[fRow].items.length;
      fIdx = nn === 0 ? 0 : Math.min(fIdx, nn - 1);
    }
    scrollToFocused();
  }
  function expandAlert(){
    var el = document.getElementById("alerts");
    if(!el.classList.contains("show")) return;
    el.scrollIntoView({block:"nearest", behavior:"smooth"});
  }

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k === "10009" || k === "GoBack") { e.preventDefault(); return; }
    switch(k){
      case "ArrowLeft": move(0, -1); e.preventDefault(); break;
      case "ArrowRight": move(0, 1); e.preventDefault(); break;
      case "ArrowUp": move(-1, 0); e.preventDefault(); break;
      case "ArrowDown": move(1, 0); e.preventDefault(); break;
      case "Enter": expandAlert(); e.preventDefault(); break;
      case "r": case "R": load(); e.preventDefault(); break;
      case "Escape": case "Backspace": e.preventDefault(); break;
    }
  });
  document.addEventListener("keydown", function(e){
    if(e.keyCode === 10009 || e.keyCode === 461){ e.preventDefault(); }
  });

  /* ---------- data ---------- */
  function fmtHour(iso){
    var d = new Date(iso);
    var h = d.getHours(), ap = h >= 12 ? "PM" : "AM"; h = h % 12; if(h === 0) h = 12;
    return h + " " + ap;
  }
  function dayName(iso, i){
    if(i === 0) return "Today";
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return days[new Date(iso + "T12:00:00").getDay()];
  }

  function renderCurrent(j){
    var c = j.current;
    var info = codeInfo(c.weather_code);
    var isNight = info.icon === "sun" && (new Date().getHours() >= 19 || new Date().getHours() < 6);
    var iconKind = isNight ? "moon" : info.icon;
    document.getElementById("hero-temp").innerHTML = Math.round(c.temperature_2m) + "<span class='deg'>&deg;F</span>";
    document.getElementById("hero-cond").textContent = info.label;
    document.getElementById("hero-art").innerHTML = iconSVG(iconKind, 260);
    var glow = heroGlow(iconKind);
    document.getElementById("hero-bg").style.setProperty("--hero-glow1", glow[0]);
    document.getElementById("hero-bg").style.setProperty("--hero-glow2", glow[1]);
    document.getElementById("s-wind").textContent = Math.round(c.wind_speed_10m);
    document.getElementById("s-hum").textContent = Math.round(c.relative_humidity_2m) + "%";
    if(j.daily){
      document.getElementById("s-hi").innerHTML = Math.round(j.daily.temperature_2m_max[0]) + "&deg;";
      document.getElementById("s-lo").innerHTML = Math.round(j.daily.temperature_2m_min[0]) + "&deg;";
    }
  }

  function renderHourly(j){
    var track = document.getElementById("hourly-track");
    track.innerHTML = "";
    sections[0].trackEl = track;
    sections[0].items = [];
    var now = new Date();
    var idx = 0;
    for(var i = 0; i < j.hourly.time.length; i++){
      if(new Date(j.hourly.time[i]) >= new Date(now.getTime() - 30*60000)){ idx = i; break; }
    }
    var count = Math.min(12, j.hourly.time.length - idx);
    for(var k = 0; k < count; k++){
      var i2 = idx + k;
      var code = j.hourly.weather_code[i2];
      var info = codeInfo(code);
      var pp = Math.round(j.hourly.precipitation_probability[i2] || 0);
      var card = document.createElement("div");
      card.className = "poster";
      card.innerHTML =
        "<div class='t'>" + (k === 0 ? "Now" : fmtHour(j.hourly.time[i2])) + "</div>" +
        iconSVG(info.icon) +
        "<div class='temp'>" + Math.round(j.hourly.temperature_2m[i2]) + "&deg;</div>" +
        "<div class='precip" + (pp === 0 ? " zero" : "") + "'>" + pp + "%</div>";
      track.appendChild(card);
      sections[0].items.push(card);
    }
  }

  function renderDaily(j){
    var track = document.getElementById("daily-track");
    track.innerHTML = "";
    sections[1].trackEl = track;
    sections[1].items = [];
    var n = Math.min(7, j.daily.time.length);
    for(var i = 0; i < n; i++){
      var info = codeInfo(j.daily.weather_code[i]);
      var card = document.createElement("div");
      card.className = "poster daycard";
      card.innerHTML =
        "<div class='t'>" + dayName(j.daily.time[i], i) + "</div>" +
        iconSVG(info.icon) +
        "<div class='temp'>" + Math.round(j.daily.temperature_2m_max[i]) + "&deg;</div>" +
        "<div class='lo'><b>" + Math.round(j.daily.temperature_2m_min[i]) + "&deg;</b> lo</div>";
      track.appendChild(card);
      sections[1].items.push(card);
    }
  }

  function renderAlerts(j){
    var box = document.getElementById("alerts");
    if(j && j.features && j.features.length > 0){
      var a = j.features[0].properties;
      document.getElementById("a-title").textContent = a.event || "Weather Alert";
      document.getElementById("a-desc").textContent = a.headline || a.description || "";
      document.getElementById("a-meta").textContent =
        (a.senderName || "") + (a.effective ? " \u00b7 Effective " + new Date(a.effective).toLocaleString() : "") +
        (j.features.length > 1 ? " \u00b7 +" + (j.features.length - 1) + " more" : "");
      box.classList.add("show");
    } else {
      box.classList.remove("show");
    }
  }

  function setUpdated(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12; if(h === 0) h = 12;
    document.getElementById("updated").textContent = "UPDATED " + h + ":" + (m < 10 ? "0"+m : m) + " " + ap;
  }

  var omOk = false;
  function load(){
    fetch(OM_URL, {cache: "no-cache"})
      .then(function(r){ if(!r.ok) throw new Error("om " + r.status); return r.json(); })
      .then(function(j){
        omOk = true;
        renderCurrent(j); renderHourly(j); renderDaily(j); setUpdated();
        scrollToFocused();
      })
      .catch(function(){
        document.getElementById("hero-cond").textContent = "Offline \u2014 retrying";
      });
    fetch(NWS_URL, {cache: "no-cache", headers: {"Accept": "application/geo+json"}})
      .then(function(r){ if(!r.ok) throw new Error("nws " + r.status); return r.json(); })
      .then(renderAlerts)
      .catch(function(){ /* alerts optional; stay silent */ });
  }

  load();
  setInterval(load, 15 * 60 * 1000);
})();
</script>
